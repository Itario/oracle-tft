# Publie site/ sur GitHub Pages à chaque poussée sur main.
# Le site est entièrement statique : ni build, ni dépendance.
name: Déployer le site

on:
  push:
    branches: [main]
  # ⚠ SANS CECI, LE RELEVÉ AUTOMATIQUE N'ATTEINT JAMAIS LE SITE PUBLIÉ.
  #
  # Une poussée faite PAR un workflow, avec le GITHUB_TOKEN, ne déclenche
  # aucun autre workflow : GitHub le refuse délibérément pour qu'un dépôt ne
  # puisse pas se mettre en boucle. Donc `push` ci-dessus ne voyait que les
  # poussées humaines.
  #
  # Constaté le 04/11 : quatre commits « Oracle TFT » (199219f, e712054,
  # ea05ae6, 142e404) et pas un seul déploiement en face. Huit relevés par
  # jour écrivaient dans data/, et le site servait les données de la dernière
  # poussée à la main. La panne datait de la création du relevé.
  workflow_run:
    workflows: ["Relevé de méta"]
    types: [completed]
  workflow_dispatch:        # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    # Un relevé qui a échoué ne mérite pas d'être publié. Les autres
    # déclencheurs (poussée, bouton) passent sans condition.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      # `ref: main` n'est pas décoratif. Sur un événement workflow_run, le SHA
      # par défaut est celui sur lequel le RELEVÉ a tourné — c'est-à-dire
      # AVANT sa propre poussée. On publierait les données de la veille en
      # croyant publier les fraîches. On demande donc explicitement la pointe.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # site/data/ et site/oracle.html ne sont pas versionnés : ils descendent
      # de data/releves/, seule source de vérité. On les régénère ici, ce qui
      # garantit que le site publié ne peut pas diverger des relevés.
      - name: Régénérer le site depuis les relevés
        run: |
          python3 tools/build/build_site.py
          python3 tools/build/build_oracle.py
          echo "Fichiers produits :"
          find site -type f | sort

      - name: Vérifier que le site ne contient pas de clé API
        run: |
          # on cherche le FORMAT d'une clé, pas la chaîne "RGAPI-" :
          # sinon le garde-fou se déclencherait sur sa propre documentation.
          if grep -rInE "RGAPI-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}" site/ data/ 2>/dev/null; then
            echo "::error::Une clé API Riot a été trouvée dans les fichiers publiés."
            exit 1
          fi
          # Même garde que le relevé : la page du joueur porte un puuid, et ce
          # qui part ici part sur le web. Ne retire jamais ce garde-fou.
          if grep -rIn "puuid" site/ data/ 2>/dev/null; then
            echo "::error::Un champ puuid a été trouvé dans les fichiers publiés."
            exit 1
          fi
          echo "Ni clé API, ni puuid."

      # NE PAS remettre `enablement: true` ici.
      # Essayé le 02/11 pour que le workflow active Pages lui-même sur un dépôt
      # neuf. Échec : « Create Pages site failed — Resource not accessible by
      # integration ». Le GITHUB_TOKEN d'un workflow ne peut pas créer le site,
      # même avec `pages: write` — cette création demande des droits d'admin
      # sur le dépôt.
      #
      # Sur un dépôt recréé de zéro, il faut donc UNE action manuelle, une fois :
      #     Settings -> Pages -> Source : GitHub Actions
      # Sans elle, tous les déploiements échouent. C'est consigné ici plutôt
      # que dans un README parce que c'est ici qu'on reviendra chercher.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: pages
        uses: actions/deploy-pages@v4
