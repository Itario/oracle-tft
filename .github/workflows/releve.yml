# Relevé automatique de la méta, sans navigateur et sans intervention.
#
# Pourquoi ici et pas sur la machine de Clément : le runner GitHub a un accès
# réseau libre. Le conteneur d'une session Claude, lui, se voit refuser
# d3.tft.tools au CONNECT (403), et MetaTFT exige Chrome. C'est le seul
# endroit où ce relevé peut tourner tout seul.
name: Relevé de méta

on:
  schedule:
    # TOUTES LES TROIS HEURES, et ce n'est toujours pas du zèle.
    #
    # Mesuré le 04/11 : les exécutions planifiées de GitHub arrivent avec
    # 3 à 7 HEURES de retard (cron 22h13 UTC -> commit 01h20 ; cron 07h13
    # -> commit 14h21). Le planificateur est en « meilleur effort » et les
    # dépôts publics passent en dernier. Deux créneaux par jour, décalés de
    # sept heures, ne garantissent plus rien du tout.
    #
    # Huit créneaux rendent le retard sans conséquence : quel que soit le
    # décalage, un passage tombe dans les heures qui suivent le patch. Et
    # ça reste gratuit — Actions est illimité sur un dépôt public, le
    # script dure 25 s, et il n'écrit QUE si le patch a changé (garde-fou
    # « un relevé figé par patch », tools/releve/tactics.py).
    #
    # Minute 13 : les minutes rondes concentrent la charge des runners.
    - cron: "13 1,4,7,10,13,16,19,22 * * *"
    # ── SEMAINE DE LANCEMENT D'UN SET : TOUTES LES HEURES ────────────────
    # GitHub ne livre qu'une partie des créneaux planifiés : 13 exécutions
    # en quatre jours pour 32 créneaux, mesuré du 05 au 09/11. À ce rythme,
    # le premier relevé du Set 19 pourrait arriver huit heures après le
    # patch — le jour où la méta bouge d'heure en heure. Du 30/11 au 07/12,
    # un créneau par heure ; le script ne réécrit le relevé que s'il a mûri,
    # donc un créneau de trop ne coûte qu'une lecture de page.
    # À RETIRER après le 07/12 (sans conséquence si on l'oublie : il ne se
    # redéclenchera qu'un an plus tard).
    - cron: "43 * 30 11 *"
    - cron: "43 * 1-7 12 *"
  workflow_dispatch:
    inputs:
      rang:
        description: "Tranche : 0=Master+, 1=Diamant+, 4=GM+"
        required: false
        default: "0"
      forcer:
        description: "Réécrire un relevé déjà présent pour ce patch"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  relever:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relever la méta
        run: |
          python3 tools/releve/tactics.py \
            --rang "${{ github.event.inputs.rang || '0' }}" \
            ${{ github.event.inputs.forcer == 'true' && '--forcer' || '' }}

      - name: Archiver le set qui se termine
        # Ne fait rien, sauf le jour où le relevé ci-dessus vient de passer au
        # set suivant : c'est la seule fenêtre où la position, la barre et les
        # compos du set précédent sont encore sur le disque, juste avant que
        # les étapes suivantes ne les réécrivent. Voir tools/build/cloture.py.
        run: python3 tools/build/cloture.py
        continue-on-error: true

      - name: Relever les compos
        # APRÈS tactics.py : il revérifie à chaque passage que la tranche de
        # rang des compos correspond bien à celle du relevé d'unités, au lieu
        # de le supposer. Toléré en échec : une page peut changer de forme.
        run: python3 tools/releve/compos.py
        continue-on-error: true

      - name: Mettre à jour la table de recettes
        # APRÈS tactics.py : elle se cale sur les objets vus dans le dernier
        # relevé, ce qui lui évite de dépendre d'un préfixe de set.
        # Ne retélécharge que si le patch a changé — le fichier de
        # CommunityDragon pèse plusieurs mégaoctets.
        run: python3 tools/releve/recettes.py
        continue-on-error: true

      - name: Relever la barre de Challenger
        # La cible, mesurée plutôt que supposée. Tourne à chaque fois : le
        # classement bouge tous les jours, contrairement au patch.
        #
        # ⚠ TOLÉRÉE EN ÉCHEC DEPUIS LE 10/11. Elle ne l'était pas, et la
        # répétition du 1er décembre a montré le résultat : un classement
        # vide faisait sortir le script en erreur, donc mourir le job, donc
        # disparaître la poussée — et avec elle le premier relevé du Set 19,
        # qui avait pourtant réussi. Le script sait maintenant écrire un
        # classement vide comme un état ; ceci est la seconde ceinture, pour
        # le cas où la page changerait de forme ce jour-là.
        run: python3 tools/releve/barre.py --region euw
        continue-on-error: true

      - name: Relever la position du joueur
        # APRÈS barre.py, qui n'est pas un détail : joueur.py lit
        # data/barre.json pour convertir l'écart à la barre en parties.
        # Inversé, l'écart serait calculé sur le seuil de la veille.
        #
        # Ne fait pas échouer le relevé de méta s'il casse : la page d'un
        # joueur change de structure plus souvent qu'un classement.
        run: python3 tools/releve/joueur.py --region euw --nom Itario --tag EUW
        continue-on-error: true

      - name: Les leçons du projet, rendues exécutables
        # APRÈS les relevés, AVANT la poussée : un relevé qui violerait une
        # leçon (un puuid recopié, une population non vérifiée) ne doit pas
        # entrer dans le dépôt.
        run: python3 tools/tests/test_socle.py

      - name: Vérifier qu'aucune clé API n'a été écrite
        run: |
          # Même garde-fou que le déploiement. Un relevé vient du réseau :
          # on ne le pousse jamais sans l'avoir regardé.
          if grep -rInE "RGAPI-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}" data/ 2>/dev/null; then
            echo "::error::Une chaîne au format clé API Riot se trouve dans data/."
            exit 1
          fi
          # La page du joueur PORTE un puuid. joueur.py ne le recopie pas,
          # mais ce dépôt est public et un puuid est un identifiant Riot
          # stable : on ne se repose pas sur la vigilance d'un script.
          # Ne retire jamais ce garde-fou non plus.
          if grep -rIn "puuid" data/ 2>/dev/null; then
            echo "::error::Un champ puuid se trouve dans data/ — dépôt public."
            exit 1
          fi

      - name: Pousser le relevé s'il y en a un nouveau
        run: |
          # ⚠ NE JAMAIS LISTER UN FICHIER SANS VÉRIFIER QU'IL EXISTE.
          # `git add` sur un chemin absent échoue sèchement ("pathspec did
          # not match any files") et emporte toute l'étape : le 04/11, une
          # étape tolérée en échec a produit un fichier manquant, et le
          # commit a sauté — emportant AUSSI le relevé qui, lui, avait
          # réussi. Une étape tolérante en amont ne sert à rien si celle
          # d'après ne l'est pas.
          SUIVIS=""
          for p in data/releves-tt data/barre.json data/joueur.json \
                   data/recettes.json data/compos.json data/archive; do
            [ -e "$p" ] && SUIVIS="$SUIVIS $p"
          done
          if [ -z "$SUIVIS" ]; then
            echo "Aucun fichier de relevé présent — rien à pousser."
            exit 0
          fi
          if [ -z "$(git status --porcelain $SUIVIS)" ]; then
            echo "Rien de neuf : ni patch, ni classement, ni position."
            exit 0
          fi
          git config user.name  "Oracle TFT"
          git config user.email "noreply@anthropic.com"
          git add $SUIVIS
          # Le titre dit CE QUI a changé. Jusqu'au 10/11 il ne nommait que le
          # premier fichier de la liste : treize commits de suite titrés
          # « barre », y compris ceux qui apportaient un patch neuf.
          QUOI=$(git diff --cached --name-only | xargs -n1 basename \
                 | sed 's/\.json$//' | paste -sd, - | sed 's/,/ · /g')
          git commit -m "Relevé automatique : $QUOI

          Relevé pris sur tactics.tools par le workflow, sans navigateur.
          C'est cette série (data/releves-tt/) qui dit quel set et quel patch
          sont en ligne : voir tools/lib/mesures.py, set_courant()."
          git push
