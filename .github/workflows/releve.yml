# Relevé automatique de la méta, sans navigateur et sans intervention.
#
# Pourquoi ici et pas sur la machine de Clément : le runner GitHub a un accès
# réseau libre. Le conteneur d'une session Claude, lui, se voit refuser
# d3.tft.tools au CONNECT (403), et MetaTFT exige Chrome. C'est le seul
# endroit où ce relevé peut tourner tout seul.
name: Relevé de méta

on:
  schedule:
    # TOUTES LES TROIS HEURES, et ce n'est toujours pas du zèle.
    #
    # Mesuré le 04/11 : les exécutions planifiées de GitHub arrivent avec
    # 3 à 7 HEURES de retard (cron 22h13 UTC -> commit 01h20 ; cron 07h13
    # -> commit 14h21). Le planificateur est en « meilleur effort » et les
    # dépôts publics passent en dernier. Deux créneaux par jour, décalés de
    # sept heures, ne garantissent plus rien du tout.
    #
    # Huit créneaux rendent le retard sans conséquence : quel que soit le
    # décalage, un passage tombe dans les heures qui suivent le patch. Et
    # ça reste gratuit — Actions est illimité sur un dépôt public, le
    # script dure 25 s, et il n'écrit QUE si le patch a changé (garde-fou
    # « un relevé figé par patch », tools/releve/tactics.py).
    #
    # Minute 13 : les minutes rondes concentrent la charge des runners.
    - cron: "13 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch:
    inputs:
      rang:
        description: "Tranche : 0=Master+, 1=Diamant+, 4=GM+"
        required: false
        default: "0"
      forcer:
        description: "Réécrire un relevé déjà présent pour ce patch"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  relever:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Relever la méta
        run: |
          python3 tools/releve/tactics.py \
            --rang "${{ github.event.inputs.rang || '0' }}" \
            ${{ github.event.inputs.forcer == 'true' && '--forcer' || '' }}

      - name: Relever la barre de Challenger
        # La cible, mesurée plutôt que supposée. Tourne à chaque fois : le
        # classement bouge tous les jours, contrairement au patch.
        run: python3 tools/releve/barre.py --region euw

      - name: Vérifier qu'aucune clé API n'a été écrite
        run: |
          # Même garde-fou que le déploiement. Un relevé vient du réseau :
          # on ne le pousse jamais sans l'avoir regardé.
          if grep -rInE "RGAPI-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}" data/ 2>/dev/null; then
            echo "::error::Une chaîne au format clé API Riot se trouve dans data/."
            exit 1
          fi

      - name: Pousser le relevé s'il y en a un nouveau
        run: |
          if [ -z "$(git status --porcelain data/releves-tt data/barre.json)" ]; then
            echo "Rien de neuf : ni patch, ni mouvement du classement."
            exit 0
          fi
          git config user.name  "Oracle TFT"
          git config user.email "noreply@anthropic.com"
          git add data/releves-tt data/barre.json
          FICHIER=$(git diff --cached --name-only | head -1)
          git commit -m "Relevé automatique : $(basename "$FICHIER" .json)

          Relevé pris sur tactics.tools par le workflow, sans navigateur.
          Série parallèle à data/releves/ (MetaTFT) : voir l'en-tête de
          tools/releve/tactics.py pour pourquoi les deux ne se mélangent pas."
          git push
