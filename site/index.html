  const n = D.compos_lui?.augments?.entrees_trouvees;
  return tete + `
    <p><b>${esc(p.constat || "")}</b></p>
    <ul class="faible">${(p.preuves || []).map(x => `<li>${esc(x)}</li>`).join("")}</ul>
    ${n != null ? `<p class="faible"><b>Surveillance automatique :</b>
      ${n} entrée${n > 1 ? "s" : ""} d'augment trouvée${n > 1 ? "s" : ""} au dernier
      relevé. ${n === 0 ? "Toujours vide — le jour où ce nombre bouge, la donnée est revenue."
      : "⚠ La donnée est revenue : ce bloc est à refaire."}</p>` : ""}
    <h3 style="margin:1.2rem 0 .6rem">Ce qui ne dépend pas du patch</h3>
    ${(o.cadre?.principes || []).map(x => `
      <p style="margin:.6rem 0"><b>${esc(x.titre)}.</b>
        <span class="faible">${esc(x.pourquoi)}</span></p>`).join("")}
    </div>`;
}

/* -------------------------------------------------- APRÈS la partie */
/* Tout ce qui est affiché ici est confronté à son seuil de bruit. Un
   écart qui ne le franchit pas est montré comme tel, ou pas montré. */
function barresDistribution(mi){
  const di = mi.distribution || {};
  const vals = Object.values(di);
  const tot = vals.reduce((a,b) => a + b, 0);
  if(!tot) return "";
  const att = tot / 8, max = Math.max(...vals, 1);
  return `<div class="dist">${[1,2,3,4,5,6,7,8].map(k => {
    const v = di[String(k)] ?? 0, ec = v - att, sens = ec >= 0 ? "pl" : "mo";
    return `<div class="dl">
      <span class="p">${k}<sup>${k === 1 ? "re" : "e"}</sup></span>
      <span class="b"><i class="${sens}" style="width:${v / max * 100}%"></i>
        <u style="left:${att / max * 100}%"></u></span>
      <span class="v">${v}</span>
      <span class="e ${sens}">${ec >= 0 ? "+" : "−"}${Math.abs(ec).toFixed(1)}</span>
    </div>`;
  }).join("")}<p class="faible" style="margin:.9rem 0 0">Le trait doré marque ce que
    donnerait le hasard : ${att.toFixed(1)} parties par place.</p></div>`;
}

/* -------------------------------------------------- la review */
/* Une partie seule ne permet aucune statistique : n = 1. La seule mesure
   qui tienne à cette échelle est INTERNE AU LOBBY — le rang de niveau
   contre le placement réel. Elle ne compare à aucune population, donc elle
   ne demande ni échantillon ni seuil de bruit. Tout le reste de cette
   section est un journal, pas une inférence, et c'est écrit comme tel. */

function ligneConversion(c){
  if(c == null) return "";
  const cl = c > 0 ? "pl" : (c < 0 ? "mo" : "nul");
  const signe = c > 0 ? "+" : (c < 0 ? "−" : "");
  return `<span class="conv ${cl}">${signe}${Math.abs(c).toFixed(1)}</span>`;
}

function ligneParties(p){
  const bande = p.placement <= 2 ? "or" : (p.placement <= 4 ? "ok" : "bas");
  return `<div class="partie">
    <span class="hex mini ${bande}"><span class="r">${p.placement}</span></span>
    <span class="corps">
      <span class="ros">${(p.pieces || []).map(x =>
        `<span class="puce">${esc(x)}</span>`).join("")}</span>
      <span class="meta">${fdate(p.date)} · niveau ${p.niveau ?? "?"}${
        p.rang_niveau ? ` — ${p.rang_niveau}<sup>${p.rang_niveau === 1 ? "re" : "e"}</sup> du lobby` : ""}${
        p.or_restant != null ? ` · ${p.or_restant} or restant` : ""}</span>
    </span>
    ${ligneConversion(p.conversion)}
  </div>`;
}

function blocParties(mi){
  const P = mi.parties || [];
  if(!P.length) return "";
  const dix = P.slice(0, 10), reste = P.slice(10);
  return `<h2>Tes dernières parties</h2>
    <p class="doux">Le chiffre de droite est l'écart entre ton rang de niveau dans le
      lobby et ton placement réel. <b>Positif, tu as placé au-dessus de tes
      ressources. Négatif, tu les avais et tu ne les as pas converties.</b></p>
    <p class="faible">C'est la seule mesure qui tienne sur une partie unique : elle se
      calcule à l'intérieur du lobby, sans comparaison à une population. Tout le reste
      de cette liste est un journal, pas un jugement — à n = 1, rien n'est significatif.</p>
    <div class="parties">${dix.map(ligneParties).join("")}</div>
    ${reste.length ? `<details class="pourquoi">
      <summary>Les ${reste.length} parties précédentes</summary>
      <div class="parties">${reste.map(ligneParties).join("")}</div>
    </details>` : ""}`;
}

function blocSessions(mi){
  const S = mi.sessions || [];
  if(!S.length) return "";
  return `<h2>Tes dernières sessions</h2>
    <div class="cal">${S.map(s => {
      const bon = s.placement_moyen <= 4.0;
      return `<div class="evt${bon ? " prochain" : ""}">
        <span class="dt">${fdate(s.date)}</span>
        <span class="nm">${s.n} partie${s.n > 1 ? "s" : ""} —
          <b>${s.placement_moyen.toFixed(2)}</b> de moyenne,
          ${s.top4}/${s.n} en top 4
          <span class="faible">(de la ${s.meilleur}<sup>${s.meilleur === 1 ? "re" : "e"}</sup>
          à la ${s.pire}<sup>e</sup>)</span></span>
        ${ligneConversion(s.conversion_moyenne)}</div>`;
    }).join("")}</div>`;
}

function blocRythme(mi){
  const r = mi.rythme;
  if(!r) return "";
  return `<h2>Ton rythme</h2>
    <div class="grille">
      <div class="carte"><div class="chiffre sm">${r.parties_par_jour_calendaire}</div>
        <div class="unite">parties par jour, sur toute la période</div></div>
      <div class="carte"><div class="chiffre sm">${r.jours_sans_jouer}</div>
        <div class="unite">jours sans jouer, sur ${r.etendue_jours}</div></div>
      <div class="carte"><div class="chiffre sm">${r.parties_par_jour_actif}</div>
        <div class="unite">parties les jours où tu joues</div></div>
    </div>
    <div class="note warn">Le volume gouverne le classement autant que le placement.
      À Master, la décroissance retire <b>50 LP par jour</b> une fois les 14 parties en
      banque épuisées : un joueur qui place à ${mi.placement_moyen.toFixed(2)} peut perdre
      son rang sans jamais mal jouer. C'est une mesure de régularité, pas de niveau — et
      elle ne demande aucun seuil de bruit pour être lue.</div>`;
}

function vueApres(){
  const mi = D.miroir;
  const p  = D.profil?.joueurs?.[0];
  if(!mi) return `<div class="note warn"><b>Le Miroir n'a pas encore tourné.</b>
    Lance <code>LANCER.bat</code>, puis
    <code>python3 tools/build/build_miroir.py &lt;csv&gt; &lt;résumé&gt;</code>.</div>`;

  // Ses parties ne périment pas comme la méta : ses habitudes de jeu se
  // lisent encore d'un set à l'autre. Mais elles se lisent comme une
  // archive, et la page le dit en tête plutôt que de laisser croire que ce
  // sont les parties du set en cours.
  const scA = setCourant();
  const archive = (mi.set != null && scA != null && mi.set !== scA)
    ? `<div class="archive"><b>Archive du Set ${mi.set}.</b> Tes parties du
        Set ${scA} n'ont pas encore été récoltées : tout ce qui suit décrit ton
        jeu au set précédent. Lance <code>LANCER.bat</code> après quelques
        parties classées pour le remplacer.</div>` : "";

  const S = mi.seuil_solide ?? 2;
  const ec = mi.ecarts || {};
  const libEc = {top2:"Top 2", top4:"Top 4",
                 bas2:"7<sup>e</sup> et 8<sup>e</sup>", huit:"8<sup>e</sup> place"};
  const sensEc = {top2:"haut", top4:"haut", bas2:"bas", huit:"bas"};

  const lignesEc = Object.entries(ec).filter(([,v]) => v != null).map(([k,v]) => {
    const solide = Math.abs(v) >= S;
    const bon = sensEc[k] === "haut" ? v > 0 : v < 0;
    return `<li class="${solide ? (bon ? "bon" : "mauvais") : "flou"}">
      <b>${libEc[k] || k}</b>
      <span class="z">${v > 0 ? "+" : "−"}${Math.abs(v).toFixed(2)} σ</span>
      <span class="j">${solide ? (v > 0 ? "au-dessus du hasard" : "en dessous du hasard")
                               : "dans le bruit"}</span></li>`;
  }).join("");

  const solides = mi.traits.filter(t => t.solide);
  const autres  = mi.traits.length - solides.length;
  const blocTraits = `
    <h2>Tes lignes</h2>
    ${solides.length ? `
      <p class="doux">Sur ${mi.traits.length} traits vus au moins ${mi.nmin} fois,
        <b>${solides.length}</b> sortent du bruit. Les autres sont indistinguables
        de ta moyenne à ce volume.</p>
      <div class="carte">${solides.map(t => `
        <div class="mv ${t.ecart < 0 ? "up" : "dn"}">
          <span class="nom">${nomU(t.nom)}</span>
          <span class="rg">${t.n} parties · placement ${t.placement.toFixed(2)}</span>
          <span class="d">${t.ecart > 0 ? "+" : "−"}${Math.abs(t.ecart).toFixed(2)}</span>
        </div>`).join("")}</div>
      <div class="note warn"><b>Ne pas en tirer « joue plus ${nomU(solides[0].nom)} ».</b>
        Ces mesures portent sur des <b>plateaux finaux</b> : un trait qui demande des
        unités chères veut d'abord dire que la partie se passait bien. Le biais
        gonfle ce qui est en tête. Le côté résistant au biais serait un trait présent
        quand tu fais <i>moins</i> bien${solides.some(t => t.ecart > 0)
          ? " : regarde ceux dont l'écart est positif."
          : " — et aucun ne franchit le seuil."}</div>`
    : `<div class="note">Aucun trait ne sort du bruit sur ${mi.n_parties} parties.</div>`}
    ${autres ? `<p class="faible">${autres} autres traits mesurés, tous dans le
      bruit — leur écart est plus petit que l'incertitude de mesure.</p>` : ""}
    ${mi.carries.length ? `<p class="faible">${mi.carries.length} carries mesurés,
      ${mi.carries.filter(c => c.solide).length} hors du bruit.</p>` : ""}`;

  const lach = mi.lachees || [];
  const pct = mi.n_parties ? (lach.length / (mi.n_parties + lach.length) * 100) : 0;
  const blocLach = lach.length ? `
    <h2>Les parties lâchées</h2>
    <div class="note warn"><b>${lach.length} parties écartées de la mesure</b>, soit
      ${pct.toFixed(1)} % de ton temps de jeu. Une partie quittée n'est pas une partie
      mal jouée — mais elle coûte du LP exactement pareil. C'est le seul gisement de
      points identifié qui ne demande aucun progrès technique.</div>
    <div class="cal">${lach.map(x => `<div class="evt">
      <span class="dt">${fdate(x.date)}</span>
      <span class="nm">${x.placement}<sup>e</sup>, niveau ${x.niveau}</span>
      <span class="tag">${x.or_restant} or non dépensé</span></div>`).join("")}</div>
    <p class="faible">Reconnues à leur signature : de l'or gardé et un niveau bas.
      ${mi.zone_grise ? `${mi.zone_grise} autres parties en zone grise sont
      <b>conservées</b> dans la mesure — on ne retire rien sur une présomption.` : ""}</p>` : "";

  const ind = Object.entries(mi.indisponible || {});
  return `<h1>Ce que disent tes parties</h1>
    ${archive}
    <p class="doux">${mi.n_parties} parties du Set ${mi.set}, du
      ${fdate(mi.fenetre.de)} au ${fdate(mi.fenetre.a)}${
      p?.lecture?.rang_mesure ? `. ${esc(p.lecture.rang_mesure)}` : ""}.</p>

    <div class="grille">
      <div class="carte"><div class="chiffre sm">${mi.placement_moyen.toFixed(2)}</div>
        <div class="unite">placement moyen — le hasard donne 4,50</div></div>
      <div class="carte"><div class="chiffre sm">${mi.top4_pct} %</div>
        <div class="unite">top 4 — le hasard donne 50 %</div></div>
      <div class="carte"><div class="chiffre sm">${mi.premieres_pct} %</div>
        <div class="unite">1<sup>res</sup> places — le hasard donne 12,5 %</div></div>
    </div>

    ${blocParties(mi)}
    ${blocSessions(mi)}
    ${blocRythme(mi)}

    <h2>Ta distribution</h2>
    <div class="carte">${barresDistribution(mi)}
      <ul class="ecarts">${lignesEc}</ul>
      <p class="faible" style="margin:.9rem 0 0">σ = écarts-types. Au-delà de
        ${S.toFixed(1)}, le hasard seul n'explique plus l'écart à ce volume.</p>
    </div>
    ${p?.lecture?.resume ? `<div class="note">${esc(p.lecture.resume)}</div>` : ""}

    ${blocTraits}
    ${blocLach}

    ${ind.length ? `<h2>Ce qu'on ne peut pas mesurer</h2>
      <div class="carte">${ind.map(([k,v]) =>
        `<p class="faible"><b>${esc(k)}</b> — ${esc(v)}</p>`).join("")}
      <p class="faible" style="margin-bottom:0">Et tout ce qui relève du <b>refusé</b>
        — unité non achetée, augment écarté — est hors de portée par nature : l'API ne
        livre que des plateaux finaux.</p></div>` : ""}

    ${p?.lecture ? `<details class="pourquoi">
      <summary>Les réserves sur ces chiffres</summary>
      ${p.lecture.a_refaire ? `<p class="faible"><b>À refaire :</b>
        ${esc(p.lecture.a_refaire)}</p>` : ""}
      ${p.lecture.retracte ? `<p class="faible"><b>Rétracté :</b>
        ${esc(p.lecture.retracte)}</p>` : ""}
      ${p.lecture.etiquette_abandonnee ? `<p class="faible">
        ${esc(p.lecture.etiquette_abandonnee)}</p>` : ""}
      ${p.lecture.centiles_provenance ? `<p class="faible"><b>Centiles :</b>
        ${esc(p.lecture.centiles_provenance)}</p>` : ""}
    </details>` : ""}`;
}

/* -------------------------------------------------- SUIVI */

/* -------------------------------------------------- la barre */
/* La cible, mesurée au lieu d'être supposée. On compare aux 25 DERNIERS
   Challengers : la médiane du palier décrit des joueurs déjà installés,
   pas le ticket d'entrée. */
/* LA CONTESTATION — ce que jouaient les sept autres.
 *
 * collecte.py enregistre l'objet de partie ENTIER, donc les huit plateaux.
 * On n'en lisait que son rang. C'est l'axe le plus discriminant entre Master
 * et Challenger, et personne ne peut le publier : il demande SES lobbies. */
function blocContestation(){
  const C = D.contestation;
  if(!C) return "";
  const gC = garde(C, "Quand ta ligne est contestée");
  if(gC !== null) return gC;
  if(!C?.par_champion?.length) return "";
  const g = C.global;
  const nom = u => { const t = nomU(u); return t.charAt(0).toUpperCase() + t.slice(1); };

  const verdict = !g ? "" : (g.solide
    ? `<div class="regle"><div class="regle-b">mesuré sur tes lobbies</div>
        <p style="margin:0">Quand au moins un adversaire construisait ton carry,
        tu places <b>${g.placement_conteste}</b> contre <b>${g.placement_seul}</b>
        quand tu étais seul dessus — <b>${g.ecart > 0 ? "+" : ""}${g.ecart} place</b>,
        pour un seuil de bruit de ±${g.seuil_bruit}. <b>L'écart est réel.</b>
        La charte l'affirmait depuis le début sans preuve ; c'en est une, et
        elle vient de tes propres parties.</p></div>`
    : `<div class="note warn">Seul : <b>${g.placement_seul}</b> sur ${g.n_seul}
        parties. Contesté : <b>${g.placement_conteste}</b> sur ${g.n_conteste}.
        Écart ${g.ecart > 0 ? "+" : ""}${g.ecart} pour un bruit de
        ±${g.seuil_bruit} : <b>ça ne tranche pas encore</b>${
        g.parties_requises ? ` — il faudrait environ ${nb(g.parties_requises)}
        parties` : ""}.</div>`);

  const ligne = c => `
    <div class="ol" style="grid-template-columns:7rem 1fr 4.5rem">
      <span class="n">${nom(c.champion)}</span>
      <span class="b r">${c.n} parties · contesté ${c.part_contestee_pct} %
        ${c.presence_attendue != null
          ? `· vu ${c.presence_moyenne} en face pour ${c.presence_attendue} attendus`
          : ""}</span>
      <span class="v ${c.rapport > 1 ? "mo" : "pl"}">${c.rapport ?? "—"}</span>
    </div>`;

  return `<h2>Ce que jouaient les sept autres</h2>
    <p class="doux">Chaque partie récoltée contient les <b>huit</b> plateaux, pas
      seulement le tien. Si une unité est présente sur p % des plateaux du ladder,
      on en attend <b>7 × p</b> chez tes adversaires : le rapport entre l'observé
      et cet attendu est la seule lecture honnête. <b>Sous 1, tu la trouves moins
      disputée que la moyenne ; au-dessus, tu tombes dessus plus souvent que le
      hasard ne l'explique.</b> ${nb(C.n_parties)} parties, repère du patch
      ${esc(String(C.patch_releve))}.</p>

    ${verdict}

    <div class="grille">
      <div class="carte">
        <h3 style="margin:0 0 .8rem">Plus disputés que prévu</h3>
        <div class="dist">${(C.plus_disputes_que_prevu || []).map(ligne).join("")}</div>
      </div>
      <div class="carte">
        <h3 style="margin:0 0 .8rem">Moins disputés que prévu</h3>
        <div class="dist">${(C.moins_disputes_que_prevu || []).map(ligne).join("")}</div>
      </div>
    </div>

    <p class="faible">⚠ <b>Le biais va toujours dans le même sens.</b> Le joueur
      qui PERD une contestation meurt tôt, sans objets sur l'unité disputée, et
      n'apparaît donc pas comme contestant — surtout dans les parties où la
      contestation a été la plus violente. <b>Tout chiffre ici est un plancher.</b>
      Et un rapport supérieur à 1 n'est pas une faute : il peut venir des heures
      auxquelles tu joues. ${esc((C.reserves || {}).pas_une_faute || "")}</p>`;
}

/* LES FUITES — ce qui coûte des LP sans aucun défaut de jeu.
 *
 * Tous les autres blocs cherchent une faiblesse technique et répondent non :
 * rang de niveau 3.91/8, conversion positive, or restant médian 2, deux
 * traits sur 24 hors du bruit, aucun carry sur 12. Chercher plus loin dans
 * cette direction produirait du conseil tiré du hasard. Celui-ci chiffre ce
 * qui reste, et c'est la seule règle de décision que le projet ait produite. */
function blocFuites(){
  const F = D.fuites;
  const gF = garde(F, "Ce qui te coûte des LP sans faute de jeu");
  if(gF !== null) return gF;
  if(!F?.abandons) return "";
  const A = F.abandons, R = F.rythme || {};
  const v = x => x != null;          // « présent », zéro compris

  // Chaque carte ne s'affiche que si ses chiffres existent. Une récolte de
  // début de set n'a ni abandon, ni écart à la barre, ni rythme mesurable :
  // la première version de ce bloc y affichait « null % » et « undefined
  // parties » — trouvé par le contrôle de rendu, pas par un test de données.
  const cartes = [
    A.n > 0 && v(A.cout_total_au_rang_actuel) ? `<div class="carte">
        <div class="chiffre">${nb(A.cout_total_au_rang_actuel)}</div>
        <div class="unite">LP, tes ${A.n} abandons à ton rang d'aujourd'hui</div>
        <p class="faible" style="margin:.8rem 0 0">${v(A.part_de_l_ecart_a_la_barre_pct)
          ? `<b>${A.part_de_l_ecart_a_la_barre_pct} % de l'écart à Challenger</b>, pour `
          : ""}${A.part_des_parties_pct} % de tes parties.</p>
      </div>` : "",
    v(R.jours_actifs_requis) ? `<div class="carte">
        <div class="chiffre">${R.jours_actifs_requis}</div>
        <div class="unite">jours de jeu jusqu'à la barre</div>
        <p class="faible" style="margin:.8rem 0 0">À ton rythme réel
          (${R.parties_par_jour_actif} parties les jours où tu joues) et à
          ${F.lp_par_partie_attendu} LP la partie, soit
          <b>${R.lp_par_jour_actif > 0 ? "+" : ""}${R.lp_par_jour_actif} LP par
          jour joué</b>.</p>
      </div>`
    : v(R.lp_par_jour_actif) ? `<div class="carte">
        <div class="chiffre sm">${R.lp_par_jour_actif > 0 ? "+" : ""}${R.lp_par_jour_actif} LP</div>
        <div class="unite">par jour joué</div>
        <p class="faible" style="margin:.8rem 0 0">${R.parties_par_jour_actif}
          parties les jours où tu joues, à ${F.lp_par_partie_attendu} LP la
          partie.</p>
      </div>` : "",
    v(R.jours_sans_jouer) && v(R.etendue_jours) ? `<div class="carte">
        <div class="chiffre sm">${R.jours_sans_jouer}<span class="faible" style="font-size:.5em">/${R.etendue_jours}</span></div>
        <div class="unite">jours sans jouer sur la période</div>
        <p class="faible" style="margin:.8rem 0 0">Un taux de change, pas un
          reproche : à toi de décider. Un travail et des enfants ne se négocient
          pas contre des LP.</p>
      </div>` : "",
  ].filter(Boolean).join("");

  return `<h2>Ce qui te coûte des LP sans faute de jeu</h2>
    <p class="doux">${esc(F.pourquoi || "")}</p>

    ${v(A.cout_d_un_abandon_maintenant) && v(F.lp_par_partie_attendu) ? `
    <div class="regle"><div class="regle-b">règle, tirée du barème</div>
      <p style="margin:0"><b>Ne pas lancer une partie coûte 0 LP. En lancer une
        et l'abandonner en coûte ${Math.abs(Math.round(F.bareme.lp_8e_place))}</b>
        — et te fait renoncer aux ${F.lp_par_partie_attendu} qu'une partie
        ordinaire rapporte. <b>Soit ${A.cout_d_un_abandon_maintenant} LP d'écart
        par abandon.</b> Ce n'est pas de la discipline, c'est une asymétrie :
        si tu risques d'être interrompu, la file d'attente est le mauvais choix
        — pas le jeu.</p>
    </div>` : ""}

    ${cartes ? `<div class="grille">${cartes}</div>` : ""}

    ${A.n > 0 ? `
    <h3 style="margin-top:1.6rem">Les parties lâchées</h3>
    <div class="dist">${(A.detail || []).map(d => `
      <div class="ol" style="grid-template-columns:6.5rem 1fr 5.5rem">
        <span class="n">${fdate(d.date)}</span>
        <span class="b r">${d.placement}<sup>e</sup> · niveau ${d.niveau} ·
          <b>${d.or_restant} or non dépensé</b></span>
        <span class="v mo">${d.manque_a_gagner > 0 ? "−" : ""}${Math.abs(d.manque_a_gagner)} LP</span>
      </div>`).join("")}</div>
    <p class="faible">L'or non dépensé est la signature : qui lâche arrête
      d'acheter et de monter. ${A.zone_grise_signalee} autre(s) partie(s)
      ressemblent à des abandons sans en porter la signature complète — elles
      sont signalées mais <b>jamais retirées d'office</b>.</p>` : `
    <div class="note"><b>Aucune partie lâchée</b> sur les ${nb(F.n_parties ?? 0)}
      récoltées. Rien à reprendre de ce côté.</div>`}

    <div class="note">${A.n > 0 ? esc(A.reserve) + " " : ""}${esc(F.decroissance?.note || "")}</div>`;
}

/* La distance à Challenger, en parties.
 *
 * C'est le seul endroit du site qui réponde à la question du projet. Tout le
 * reste décrit un niveau ; ceci chiffre un trajet. Et il ne l'affiche qu'avec
 * sa fourchette et son avertissement : un nombre seul serait un mensonge,
 * parce que deux effets non modélisés le tirent vers le haut (les gains de
 * LP se compriment en montant, le placement dérive vers 4.50). */
function blocProjection(){
  const j = D.joueur;
  // Non classé, ou position d'un autre set : le paragraphe de position, plus
  // bas dans la vue, le dit déjà. Inutile de le répéter ici.
  if(!j || j.etat === "non_classe") return "";
  if(j.set != null && setCourant() != null && j.set !== setCourant()) return "";
  if(!j?.position) return "";
  if(!j.projection || j.projection.lp_manquants == null){
    // Une position, mais pas d'écart à convertir : barème pas encore
    // ajustable, ou pas de seuil de Challenger valide pour ce set.
    const E = j.ecart_a_la_barre || {}, P = j.projection;
    return `<h2>Combien de parties</h2>
      <div class="note"><b>${palierFr(j.position.palier)}, ${nb(j.position.lp)} LP.</b>
        ${P ? `Au placement mesuré (${P.placement_projete}), une partie rapporte
          <b>${P.lp_par_partie_attendu > 0 ? "+" : ""}${P.lp_par_partie_attendu} LP</b>
          en moyenne. ` : `Pas encore assez de parties classées ce set pour ajuster
          ton barème de LP : ${nb(j.bareme_lp?.parties_retenues)} retenue(s), il en
          faut six. `}
        Le nombre de parties jusqu'à Challenger n'est pas calculé :
        ${esc(String(E.raison_si_absent || "aucun écart à la barre").replace(/\.$/, ""))}.</div>`;
  }
  const pr = j.position, p = j.projection, e = p.erreur_decomposee || {};
  const fo = p.parties_fourchette;
  const haut = /^(MASTER|GRANDMASTER|CHALLENGER)/.test(String(pr.palier || ""));
  const sousM = j.ecart_a_la_barre?.dont_jusqu_a_master;

  // Jours sans jouer : la décroissance ne pardonne pas à Master, et c'est le
  // seul chiffre de cette page qui se périme tout seul.
  let dormance = "";
  if(pr.derniere_partie_connue){
    const d = Math.floor((Date.now() - Date.parse(pr.derniere_partie_connue))
                         / 86400000);
    if(d >= 3 && haut) dormance = `<div class="note warn"><b>${d} jours sans partie
      classée.</b> À Master, les 14 parties en banque s'épuisent à une par
      jour, puis c'est −50 LP par jour. L'inaction coûte des LP que le
      placement devra regagner.</div>`;
  }

  return `<h2>Combien de parties</h2>
    <p class="doux">Au-dessus de Master il n'y a plus de division ni de série de
      promotion : de Master 0 LP jusqu'à Challenger, c'est <b>une seule échelle
      continue</b>. C'est ce qui permet de convertir un écart de LP en nombre de
      parties — et de répondre enfin à la question du projet.
      ${sousM != null ? `<b>Tu n'y es pas encore :</b> ${nb(sousM)} des
        ${nb(p.lp_manquants)} LP qui manquent sont des divisions à remonter jusqu'à
        Master, où chaque place rapporte plus qu'en haut. Cette partie du chemin
        ira plus vite que le chiffre ne le dit.` : ""}</p>

    <div class="grille">
      <div class="carte">
        <div class="chiffre">${nb(p.parties_estimees)}</div>
        <div class="unite">parties, au rythme mesuré</div>
        <p class="faible" style="margin:.8rem 0 0">Fourchette
          <b>${fo ? nb(fo[0]) + "–" + nb(fo[1]) : "—"}</b> à deux
          écarts-types. ${nb(p.lp_manquants)} LP séparent tes
          ${nb(pr.lp)} LP du seuil.</p>
      </div>
      <div class="carte">
        <div class="chiffre sm">${p.lp_par_partie_attendu > 0 ? "+" : ""}${p.lp_par_partie_attendu} LP</div>
        <div class="unite">par partie, à ${p.placement_projete} de placement</div>
        <p class="faible" style="margin:.8rem 0 0">± ${p.erreur_type}.
          L'incertitude vient de ton placement (${e.placement}), pas du barème
          de LP (${e.bareme}) — et elle décroît en 1/√n.</p>
      </div>
      <div class="carte">
        <div class="chiffre sm">${nb(pr.rang_region)}<sup>e</sup></div>
        <!-- « euw1 » est le code Riot brut : on affiche la région, pas le shard. -->
        <div class="unite">sur ${esc(String(j.joueur?.region || "")
          .replace(/\d+$/, "").toUpperCase() || "la région")}</div>
        <p class="faible" style="margin:.8rem 0 0">Top ${pr.percentile_region} %
          de la région, top ${pr.percentile_monde} % du monde. Un rang se lit
          sans réserve : c'est un comptage, pas une performance.</p>
      </div>
    </div>

    ${dormance}

    <div class="note">${esc(p.avertissement)}</div>

    ${(() => {
      // Deux chiffres se contredisent : ~53 parties selon l'écart de LP,
      // 381 au compteur des 25 derniers Challengers. On publie les deux
      // témoins qui arbitrent, plutôt que de choisir en silence.
      const c = j.contre_epreuve, r = j.rang;
      if(!c && !r) return "";
      return `<h3 style="margin-top:2rem">Ce qui contredit ce chiffre</h3>
        <div class="carte">
          ${r ? `<p>Tu es <b>${nb(r.rang_region)}<sup>e</sup></b> et Challenger
            s'arrête au <b>${nb(r.challengers_region)}<sup>e</sup></b> :
            <b>${nb(r.joueurs_a_depasser)} joueurs à dépasser</b>. Un rang se
            compare sans hypothèse ; la projection en LP en demande une — que
            ton rythme actuel tienne. ${esc(r.note.split(". ").pop())}</p>` : ""}
          ${c ? `<p class="faible">Et sans aucun modèle : sur tes
            <b>${c.n_parties} parties en Master</b>, tu as pris
            <b>${c.lp_par_partie_observe > 0 ? "+" : ""}${c.lp_par_partie_observe}
            LP par partie</b> — ${c.ecart_a_la_projection != null
              ? `soit ${Math.abs(c.ecart_a_la_projection)} de
                 ${c.ecart_a_la_projection < 0 ? "moins" : "plus"} que la
                 projection` : "à comparer à la projection"}.
            ${c.exploitable
              ? "L'écart sort du bruit : la compression est en train de se produire."
              : `Le bruit à ce volume vaut ±${c.seuil_bruit} : <b>ça ne tranche
                 pas encore</b>. Mais c'est cette mesure qui tranchera, et elle
                 s'accumule toute seule à chaque relevé.`}</p>` : ""}
        </div>`;
    })()}

    <p class="faible">Barème mesuré sur tes propres parties :
      <b>${j.bareme_lp?.droite?.pente_lp_par_place} LP par place</b>, neutre à
      la ${j.bareme_lp?.droite?.place_neutre}<sup>e</sup>
      (R² ${j.bareme_lp?.droite?.r2} sur
      ${nb(j.bareme_lp?.parties_retenues)} parties,
      ${nb(j.bareme_lp?.censurees_exclues)} écrêtées écartées).
      ${esc(j.bareme_lp?.note_assiette || "")}</p>`;
}

function blocBarre(){
  const b = D.barre, p = D.profil?.joueurs?.[0];
  // Ses chiffres ne se comparent à la barre que s'ils sont du même set.
  const mi = (D.miroir && D.miroir.set === setCourant()) ? D.miroir : null;
  if(!b) return "";
  if(b.etat === "sans_challenger" && b.haut_du_classement){
    const H = b.haut_du_classement;
    return `<h2>Où tu en es</h2>
      <div class="note"><b>Challenger n'est pas encore ouvert.</b>
        ${esc(b.etat_note || "")} Le 1<sup>er</sup> du classement
        ${esc(String(b.region || "").toUpperCase())} est à <b>${nb(H.lp_premier)} LP</b>${
        H.lp_250e != null ? `, le 250<sup>e</sup> à <b>${nb(H.lp_250e)} LP</b>` : ""}
        après ${nb(H.parties_mediane_top_250)} parties (médiane des 250 premiers).
        Relevé le ${fdate(b.genere_le)}.</div>`;
  }
  const gB = garde(b, "Où tu en es");
  if(gB !== null) return gB;
  if(!b.challenger_derniers_25) return "";
  const B = b.challenger_derniers_25;

  const ligne = (nom, sien, cible, unite, compare) => {
    const ok = compare && sien != null && sien >= cible;
    const ko = compare && sien != null && sien < cible;
    return `<div class="dl barre-l">
      <span class="p">${nom}</span>
      <span class="sien ${ok ? "pl" : (ko ? "mo" : "")}">${sien == null ? "—" : sien + unite}</span>
      <span class="cible">${cible}${unite}</span>
      <span class="j">${!compare ? "" : (ok ? "au-dessus" : "en dessous")}</span>
    </div>`;
  };

  return `<h2>Où tu en es</h2>
    <p class="doux">La barre n'est pas la médiane du palier Challenger — ce sont les
      <b>25 derniers</b>, c'est-à-dire le ticket d'entrée. Classement ${esc(b.region)}
      relevé le ${fdate(b.genere_le)} : ${nb(b.paliers?.CHALLENGER || 0)} Challengers,
      seuil à <b>${nb(b.seuil_challenger_lp)} LP</b>.</p>

    <div class="carte">
      <div class="dist barre">
        <div class="dl barre-l entete">
          <span class="p"></span><span class="sien">toi</span>
          <span class="cible">la barre</span><span class="j"></span>
        </div>
        ${mi ? ligne("top 4", mi.top4_pct, B.top4_pct_median, " %", true) : ""}
        ${mi ? ligne("1res", mi.premieres_pct, B.premieres_pct_median, " %", true) : ""}
        ${mi ? ligne("parties", mi.n_parties, B.parties_mediane, "", true) : ""}
        ${(() => {
          // La position vive d'abord. data/profil.json est saisi à la main et
          // retardait de treize jours : il ne sert plus que de repli.
          const lp = D.joueur?.position?.lp ?? p?.rang?.lp;
          return lp == null ? "" : ligne("LP", lp, B.lp_median, "", true);
        })()}
      </div>
      ${b.reserve ? `<p class="faible" style="margin:1rem 0 0">${esc(b.reserve)}</p>` : ""}
    </div>`;
}

/* LE SET QUI ARRIVE — relevé sur le PBE par tools/releve/jeu.py.
 *
 * Des faits de composition seulement : qui coûte combien, qui porte quoi, à
 * combien un trait s'active. C'est ce qu'on étudie avant un lancement. Aucune
 * force n'est affichée, parce qu'aucune n'existe : le PBE change tous les
 * jours, et sa population n'est pas celle du classé. */
function blocAVenir(){
  const a = D.meta?.a_venir;
  if(!a) return "";
  return `<h2>Le Set ${a.set} est au PBE</h2>
    <p class="doux"><b>${a.n_unites} unités et ${a.n_traits} traits</b>, lus dans les
      données de Riot le ${fdate(a.releve_le)} (apparus le
      ${fdate(a.vu_la_premiere_fois)}). Ce sont des faits de composition — coûts,
      traits, paliers — pas des forces : <b>rien ici ne dit ce qui gagnera</b>, et
      le PBE change tous les jours jusqu'à la sortie.</p>
    <div class="carte">
      <h3 style="margin:0 0 .9rem">Les unités, par coût</h3>
      <dl class="avenir">${(a.par_cout || []).map(g => `
        <dt>${g.cout}-coût</dt>
        <dd>${g.unites.map(u => `<span class="puce">${esc(u.nom)}<small>${
          esc((u.traits || []).join(" · "))}</small></span>`).join("")}</dd>`).join("")}
      </dl>
    </div>
    <details class="pourquoi">
      <summary>Les ${a.n_traits} traits et leurs paliers</summary>
      <div class="tbl"><table>
        <thead><tr><th>Trait</th><th>Paliers</th><th>Unités</th></tr></thead>
        <tbody>${(a.traits || []).map(t => `<tr>
          <td>${esc(t.nom)}</td>
          <td>${esc((t.paliers || []).join(" / "))}</td>
          <td class="faible">${esc((t.unites || []).join(", "))}</td></tr>`).join("")}</tbody>
      </table></div>
    </details>`;
}

function vueSuivi(){
  const m = D.meta, p = D.profil?.joueurs?.[0], c = D.calendrier;
  const d = m?.diff;
  const auj = new Date().toISOString().slice(0,10);

  const rotation = d ? `
    <h2>La rotation du dernier patch</h2>
    <div class="grille">
      <div class="carte"><div class="chiffre">${d.spearman}</div>
        <div class="unite">corrélation de rang</div>
        <p class="faible" style="margin:.8rem 0 0">Entre ${fdate(d.de.date)}
          (${esc(d.de.patch)}) et ${fdate(d.a.date)} (${esc(d.a.patch)}).</p></div>
      <div class="carte"><div class="chiffre sm">${d.deplacement_median} rangs</div>
        <div class="unite">déplacement médian par unité</div>
        <p class="faible" style="margin:.8rem 0 0">Maximum ${d.deplacement_max} rangs,
          sur ${d.n_comparables} unités comparables.</p></div>
      <div class="carte"><div class="chiffre sm">${d.part_reelle_pct} %</div>
        <div class="unite">du mouvement est réel</div>
        <p class="faible" style="margin:.8rem 0 0">Si rien n'avait changé, le seul
          hasard donnerait ${d.plancher_bruit}.</p></div>
    </div>
    ${d.volume && !d.volume.comparable ? `<div class="note warn"><b>Volumes
      inégaux.</b> ${esc(d.volume.avertissement || "")}</div>` : ""}
    ${!d.meme_elo ? `<div class="note warn"><b>Tranches d'elo différentes</b>
      (${esc(d.de.rang)} puis ${esc(d.a.rang)}) : une part du mouvement vient du
      changement de population, pas des patchs.</div>` : ""}
    <h2>Ce qui monte</h2>
    <div class="carte">${d.montees.map(x => ligneMouvement(x, "up")).join("")}</div>
    <h2>Ce qui tombe</h2>
    <div class="carte">${d.chutes.map(x => ligneMouvement(x, "dn")).join("")}</div>`
    : (m?.diff_raison ? `<h2>La rotation du dernier patch</h2>
        <div class="note">${esc(m.diff_raison)}</div>` : "");

  const evts = [];
  // Un patch est « relevé » si la série automatique le contient. Le drapeau
  // `releve` de calendrier.json est saisi à la main : il annonçait 18.6
  // « non relevé » alors que la série en portait 329 000 parties.
  const vus = new Set((m?.serie || []).map(r => r.patch));
  (c?.patchs || []).forEach(x => evts.push({...x, type:"patch",
    releve: x.releve || vus.has(x.nom)}));
  (c?.jalons || []).forEach(x => evts.push({...x, type:"jalon"}));
  evts.sort((a,b) => a.date.localeCompare(b.date));
  const prochain = evts.find(e => e.date > auj);

  return `<h1>Suivi</h1>
    ${blocAVenir()}
    ${blocProjection()}
    ${blocFuites()}
    ${blocContestation()}
    ${blocBarre()}
    ${(() => {
      const J = D.joueur;
      const sc = setCourant();
      if(J && J.set != null && sc != null && J.set !== sc)
        return `<div class="note">Ta position relevée est celle du Set ${J.set} ;
          elle n'est pas affichée comme courante.</div>`;
      if(J?.etat === "non_classe")
        return `<div class="note"><b>Pas encore classé au Set ${J.set ?? sc}.</b>
          ${esc(J.etat_note || "")}</div>`;
      if(J?.position){
        const q = J.position;
        return `<p class="doux"><b>${palierFr(q.palier)}, ${q.lp} LP</b> —
          relevé automatiquement le ${fdate(J.genere_le)}, dernière partie
          connue le ${fdate((q.derniere_partie_connue || "").slice(0,10))}.
          ${p ? `Objectif : ${esc(p.objectif)}. ${esc(p.riot_id)},
          ${esc(p.region.toUpperCase())}.` : ""}</p>`;
      }
      // Repli : le fichier saisi à la main, et on dit que c'est un repli.
      return p ? `<p class="doux"><b>${esc(p.rang.tier)}, ${p.rang.lp} LP</b>
        au ${fdate(p.rang.date)}. Objectif : ${esc(p.objectif)}.
        ${esc(p.riot_id)}, ${esc(p.region.toUpperCase())}.</p>
        <div class="note warn">Relevé automatique indisponible : ce chiffre est
        saisi à la main et peut avoir plusieurs jours de retard.</div>` : "";
    })()}
    ${rotation}
    <h2>Calendrier</h2>
    <div class="cal">${evts.map(e => {
      const passe = e.date <= auj, est = e === prochain;
      return `<div class="evt${passe ? " passe" : ""}${est ? " prochain" : ""}">
        <span class="dt">${fdate(e.date)}</span>
        <span class="nm">${esc(e.nom)}${e.note ? ` <span class="faible">— ${esc(e.note)}</span>` : ""}</span>
        <span class="tag${e.releve ? " ok" : ""}">${
          e.type === "jalon" ? (e.certain === false ? "estimé" : "jalon")
          : (e.releve ? "relevé" : (passe ? "non relevé" : "à venir"))}</span></div>`;
    }).join("")}</div>
    ${prochain ? `<p class="faible" style="margin-top:1rem">Prochaine échéance :
      <b>${esc(prochain.nom)}</b>, ${(() => {
        const n = Math.round((Date.parse(prochain.date) - Date.parse(auj)) / 864e5);
        return n <= 1 ? "demain" : `dans ${n} jours`; })()}.</p>` : ""}

    <h2>Les outils</h2>
    <div class="grille">
      ${m?.oracle?.disponible ? `<div class="carte"><h3>L'ancien moteur</h3>
        <p class="faible">Les fiches écrites à la main du Set ${m.oracle.set},
          dans un fichier HTML autonome.</p>
        <p><a href="oracle.html">Ouvrir</a></p></div>` : ""}
      <div class="carte"><h3>Le Carnet</h3>
        <p class="faible">Série des relevés, rotation d'un patch à l'autre, et le
          plancher de bruit avant toute conclusion.</p>
        <p><code>carnet.py lister · comparer · rotation · bruit</code></p></div>
      <div class="carte"><h3>Le Miroir</h3>
        <p class="faible">Récolte et analyse tes parties. Le lobby sert de groupe de
          contrôle : il te classe parmi tes sept adversaires.</p>
        <p><code>LANCER.bat</code></p></div>
    </div>
    ${m ? `<p class="faible">Données du site générées le ${fdate(m.genere_le)}.</p>` : ""}`;
}

/* -------------------------------------------------- rendu */
const VUES = {avant: vueAvant, fiches: vueFiches, apres: vueApres, suivi: vueSuivi};
// L'onglet s'appelait « pendant » jusqu'au 10/11 : un vieux lien y mène encore.
const ALIAS = {pendant: "fiches"};
let vueActive = "avant";

function rendre(){
  $("#v-" + vueActive).innerHTML = VUES[vueActive]();
  if(vueActive === "fiches") brancherModes();
}
function brancherModes(){
  document.querySelectorAll("[data-mode]").forEach(b =>
    b.addEventListener("click", () => { MODE = b.dataset.mode; rendre(); }));
}
function aller(v){
  vueActive = v;
  document.querySelectorAll("nav button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.vue === v)));
  document.querySelectorAll(".vue").forEach(s => s.hidden = (s.id !== "v-" + v));
  rendre();
  // On empile dans l'historique : le bouton Retour du navigateur revient à
  // l'onglet précédent, ce qui est le réflexe au téléphone.
  try { if((location.hash || "").slice(1) !== v) history.pushState({v}, "", "#" + v); }
  catch(e){}
}
document.querySelectorAll("nav button").forEach(b =>
  b.addEventListener("click", () => aller(b.dataset.vue)));
const cible = () => { const h = (location.hash || "").slice(1); return ALIAS[h] || h; };
addEventListener("popstate", () => {
  const h = cible();
  if(VUES[h] && h !== vueActive) aller(h);
});
addEventListener("hashchange", () => {
  const h = cible();
  if(VUES[h] && h !== vueActive) aller(h);
});

charger().then(() => {
  const m = D.meta;
  // ⚠ L'ÂGE DU RELEVÉ NE SE DÉDUIT PAS, IL S'AFFICHE.
  //
  // Le relevé est automatique et tourne plusieurs fois par jour : au-delà de
  // deux jours sans mise à jour, quelque chose est cassé en amont (le
  // workflow, la source), et le bandeau doit le dire en rouge. Une méta
  // périmée qui a l'air courante est pire qu'une méta absente.
  const jours = m?.releve?.date
    ? Math.floor((Date.now() - Date.parse(m.releve.date)) / 86400000) : null;
  $("#hsub").textContent = m
    ? `Set ${m.set} · patch ${m.releve.patch} · ${m.releve.rang} · ${fdate(m.releve.date)}`
      + (jours >= 2 ? `  ·  relevé il y a ${jours} jours` : "")
    : "données indisponibles";
  if(jours >= 2) $("#hsub").classList.add("perime");
  if(m) $("#pied").innerHTML =
    `Méta : ${esc(m.releve.source || "tactics.tools")} — ${nb(m.releve.n_parties)} parties,
     ${esc(m.releve.rang || "")}. Généré le ${fdate(m.genere_le)}.
     Projet personnel, sans lien avec Riot Games.`;
  const h = cible();
  aller(VUES[h] ? h : "avant");
});
</script>
</body>
</html>
