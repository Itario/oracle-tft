<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oracle TFT</title>
<style>
/* ============================================================
   ORACLE TFT — identité visuelle
   ------------------------------------------------------------
   TFT est un auto-chess, mais son plateau est HEXAGONAL. Le damier
   est la blague du nom « lolchess » ; l'hexagone est la vraie forme
   du jeu. C'est lui qui porte l'identité, et il ne sert que là où
   une unité se pose — jamais en décor.

   Palette : celle du client League. Nuit bleue, or, turquoise
   hextech. Angles vifs partout : l'interface de League ne connaît
   pas l'arrondi, elle coupe ses coins.
   ============================================================ */
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap");

:root{
  --nuit:#091428;      /* fond, le bleu du client League */
  --abysse:#0C1C32;    /* panneaux */
  --pierre:#11263F;    /* panneaux en relief, tuiles */
  --trait:#1F4766;     /* hairline hextech */
  --trait-or:#5A4A2A;  /* hairline dorée, discrète */

  --texte:#F0E6D2;     /* le parchemin de League */
  --doux:#A5B6C6;
  --faible:#6E8399;

  --or:#C8AA6E;        /* l'or de League */
  --or-vif:#E8D5A3;
  --hextech:#0AC8B9;   /* le turquoise */
  --sang:#C4414E;      /* ce qui tombe */

  --titre:"Cinzel",Georgia,serif;
  --corps:"Barlow",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}

body{
  background:var(--nuit);
  color:var(--texte);
  font-family:var(--corps);
  margin:0;line-height:1.6;
  -webkit-text-size-adjust:100%;
  /* Le plateau, en filigrane. Hexagones à sommet plat — la forme réelle des
     cases de TFT — sur une tuile qui se répète sans couture (3s par √3·s).
     Assez basse pour ne jamais concurrencer le texte. */
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='45' height='25.98' viewBox='0 0 45 25.98'><path d='M15 0L7.5 12.99L-7.5 12.99L-15 0L-7.5 -12.99L7.5 -12.99ZM60 0L52.5 12.99L37.5 12.99L30 0L37.5 -12.99L52.5 -12.99ZM15 25.98L7.5 38.97L-7.5 38.97L-15 25.98L-7.5 12.99L7.5 12.99ZM60 25.98L52.5 38.97L37.5 38.97L30 25.98L37.5 12.99L52.5 12.99ZM37.5 12.99L30 25.98L15 25.98L7.5 12.99L15 0L30 0Z' fill='none' stroke='%231F4766' stroke-opacity='.3' stroke-width='1'/></svg>");
  background-size:78px 45.03px;
  background-attachment:fixed;
}

/* ---------------------------------------------- en-tête + onglets */
header{
  position:sticky;top:0;z-index:19;
  background:linear-gradient(180deg,#0B1A2E 0%,#091428 100%);
  border-bottom:1px solid var(--trait);
  box-shadow:0 1px 0 rgba(200,170,110,.18);
}
.hwrap{max-width:1120px;margin:0 auto;padding:.85rem 20px .15rem}

.marque{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
.marque b{
  font-family:var(--titre);font-weight:700;font-size:1.5rem;
  letter-spacing:.12em;color:var(--or-vif);
}
.marque .pt{color:var(--hextech)}
.marque .sub{
  font-size:.82rem;color:var(--faible);font-weight:500;
  font-variant-numeric:tabular-nums;
}

nav{display:flex;gap:.35rem;overflow-x:auto;margin-top:.6rem;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  font-family:var(--corps);font-size:.95rem;font-weight:600;
  background:none;border:0;color:var(--doux);
  padding:.5rem .95rem .55rem;cursor:pointer;white-space:nowrap;
  position:relative;transition:color .12s;
}
nav button:hover{color:var(--texte)}
/* L'onglet actif est une tuile aux coins coupés, pas un soulignement. */
nav button[aria-selected="true"]{
  color:var(--nuit);font-weight:700;background:var(--or);
  clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);
}
nav button:focus-visible{outline:2px solid var(--hextech);outline-offset:-2px}

main{max-width:1120px;margin:0 auto;padding:2rem 20px 4.5rem}
.vue[hidden]{display:none!important}

/* ---------------------------------------------- typographie */
h1{
  font-family:var(--titre);font-weight:700;
  font-size:clamp(2rem,5vw,3.1rem);line-height:1.08;
  margin:0 0 .6rem;letter-spacing:.015em;color:var(--texte);
  text-wrap:balance;
}
h2{
  font-family:var(--titre);font-weight:700;
  font-size:clamp(1.3rem,2.9vw,1.75rem);line-height:1.15;
  margin:3rem 0 1rem;letter-spacing:.03em;color:var(--or-vif);
  text-wrap:balance;
  display:flex;align-items:center;gap:.8rem;
}
/* Le filet doré qui prolonge chaque titre : séparateur, pas ornement. */
h2::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--trait-or),transparent)}
h3{font-size:1.05rem;margin:0 0 .45rem;font-weight:700;color:var(--or-vif);
  font-family:var(--corps);letter-spacing:.01em}

p{margin:0 0 .95rem;max-width:70ch}
.doux{color:var(--doux);font-size:1.02rem}
.faible{color:var(--faible);font-size:.9rem}
a{color:var(--hextech);text-underline-offset:3px}
a:hover{color:var(--or)}

code{font-family:var(--mono);font-size:.86em;background:#0A1B2E;
  padding:.14em .45em;border:1px solid var(--trait);color:var(--or-vif)}
pre{font-family:var(--mono);font-size:.82rem;background:#0A1B2E;
  border:1px solid var(--trait);border-left:2px solid var(--or);
  padding:.9rem 1.05rem;overflow-x:auto;margin:0 0 1.1rem;line-height:1.5}
pre code{background:none;border:0;padding:0;color:var(--doux)}

/* ---------------------------------------------- panneaux */
/* Angles vifs, filet fin, et une arête dorée en haut quand le bloc
   compte plus que les autres. L'arête encode, elle ne décore pas. */
.carte{
  background:linear-gradient(180deg,var(--pierre) 0%,var(--abysse) 100%);
  border:1px solid var(--trait);
  padding:1.2rem 1.3rem;margin-bottom:1rem;position:relative;
}
.grille{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}

.chiffre{
  font-family:var(--titre);font-weight:700;
  font-size:clamp(2.7rem,7vw,4.2rem);line-height:.95;
  color:var(--or);font-variant-numeric:tabular-nums;
}
.chiffre.sm{font-size:clamp(1.9rem,4vw,2.5rem)}
.unite{font-size:.86rem;color:var(--doux);margin-top:.4rem;font-weight:500}

.note{
  border-left:2px solid var(--hextech);
  background:linear-gradient(90deg,rgba(10,200,185,.09),rgba(10,200,185,.01));
  padding:.8rem 1.05rem;margin:0 0 1.1rem;font-size:.96rem;
}
.note.warn{border-left-color:var(--or);
  background:linear-gradient(90deg,rgba(200,170,110,.11),rgba(200,170,110,.01))}
.note b{color:var(--or-vif)}

/* ---------------------------------------------- la ruche */
/* Les huit unités qui ne quittent jamais la tête, posées comme sur
   le plateau : hexagones à sommet plat, rangée décalée. Chaque hexagone
   porte le rang courant de l'unité — de l'information, pas un médaillon. */
/* Une rangée droite, comme une ligne du plateau. Pas de décalage alterné :
   sur une seule rangée il produit un zigzag, pas un damier. */
.ruche{display:flex;flex-wrap:wrap;gap:.45rem;margin:1.3rem 0 .4rem;
  justify-content:flex-start}
.hex{
  width:108px;aspect-ratio:1.1547/1;flex:0 0 auto;
  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  background:linear-gradient(165deg,#1B3A5C,#102338);
  border:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:.3rem .5rem;gap:.05rem;
}
.hex .r{font-family:var(--titre);font-weight:700;font-size:1.5rem;
  color:var(--or);line-height:1;font-variant-numeric:tabular-nums}
.hex .u{font-size:.72rem;font-weight:600;color:var(--texte);line-height:1.15;
  overflow-wrap:anywhere;hyphens:auto}
.hex .a{font-size:.63rem;color:var(--faible);font-variant-numeric:tabular-nums}
@media (max-width:420px){
  .hex{width:88px}
  .hex .r{font-size:1.15rem}
}
/* Le seul moment de mouvement de la page : la ruche se pose à l'arrivée. */
@media (prefers-reduced-motion:no-preference){
  .hex{animation:pose .5s cubic-bezier(.2,.7,.3,1) backwards}
  .hex:nth-child(1){animation-delay:.02s} .hex:nth-child(2){animation-delay:.07s}
  .hex:nth-child(3){animation-delay:.12s} .hex:nth-child(4){animation-delay:.17s}
  .hex:nth-child(5){animation-delay:.22s} .hex:nth-child(6){animation-delay:.27s}
  .hex:nth-child(7){animation-delay:.32s} .hex:nth-child(8){animation-delay:.37s}
}
@keyframes pose{from{opacity:0;transform:translateY(-9px) scale(.94)}
                to{opacity:1;transform:none}}

/* ---------------------------------------------- mouvements */
.mv{display:grid;grid-template-columns:1fr auto auto;gap:.3rem .9rem;
  align-items:baseline;padding:.55rem 0;border-bottom:1px solid rgba(31,71,102,.5)}
.mv:last-child{border-bottom:0}
.mv .nom{font-weight:600;min-width:0}
.mv .rg{font-size:.85rem;color:var(--faible);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.mv .d{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
  font-family:var(--titre);font-size:1.02rem}
.up .d{color:var(--or)} .dn .d{color:var(--sang)}
/* Un relevé de méta vieux d'une semaine ou plus doit se voir depuis le
   bandeau, sans qu'on ait à lire la date et à faire la soustraction. */
.perime{color:var(--sang)}
/* La liste BiS : numérotée, parce que l'ordre du BiS est une information. */
/* Les lignes du bloc objets. Classes PROPRES : emprunter .dl, taillé pour la
   distribution des placements (quatre colonnes fixes), cassait le nom des
   objets sur deux lignes et masquait la barre, dont la classe y est .b. */
/* Le rendu du NON-MESURÉ. Volontairement différent : bandeau, fond et
   bordure à gauche, pour qu'un guide ou un raisonnement ne puisse jamais
   se lire comme un relevé. */
/* Une RÈGLE dérivée d'une mesure. Elle ne porte PAS le costume .ref, qui
   veut dire « pas mesuré » : celle-ci sort du barème ajusté sur ses propres
   parties. Même forme pour que l'œil la repère, accent hextech au lieu de
   l'or pour que la distinction tienne. */
.regle{position:relative;border-left:3px solid var(--hextech);
       background:rgba(10,200,185,.06);padding:2.1rem 1.2rem 1.2rem;margin:.9rem 0}
.regle-b{position:absolute;top:0;left:0;font-size:.68rem;letter-spacing:.09em;
         text-transform:uppercase;font-weight:700;color:var(--nuit);
         background:var(--hextech);padding:.16rem .55rem}
.ref{position:relative;border-left:3px solid var(--or);
     background:rgba(200,170,110,.05);padding:2.1rem 1.2rem 1.2rem;margin:.9rem 0}
.ref-b{position:absolute;top:0;left:0;font-size:.68rem;letter-spacing:.09em;
       text-transform:uppercase;font-weight:700;color:var(--nuit);
       background:var(--or);padding:.16rem .55rem}
table.cotes{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
table.cotes th,table.cotes td{padding:.26rem .3rem;text-align:right;
       border-bottom:1px solid rgba(31,71,102,.45);font-size:.9rem}
table.cotes th{color:var(--or);font-family:var(--titre);text-align:right}
table.cotes td.fort{color:var(--hextech);font-weight:700}
table.cotes td.nul{color:rgba(165,182,198,.35)}
.comp-t{display:flex;align-items:baseline;gap:.55rem;flex-wrap:wrap;margin-bottom:.6rem}
.comp-t .lp{font-family:var(--titre);font-weight:700;font-size:1.5rem;color:var(--or)}
.jauge{position:relative;height:18px;background:rgba(31,71,102,.38)}
.jauge i{display:block;height:100%;background:linear-gradient(90deg,var(--hextech),#0A8C84)}
.jauge span{position:absolute;right:.45rem;top:0;line-height:18px;font-size:.76rem;
            font-weight:600;color:var(--texte)}
.ol{display:grid;grid-template-columns:7.5rem 1fr 2.6rem;gap:.7rem;
    align-items:center;padding:.22rem 0}
.ol .n{font-family:var(--titre);font-weight:700;color:var(--or);font-size:.98rem}
.ol .b{position:relative;height:14px;background:rgba(31,71,102,.38)}
.ol .b i{display:block;height:100%;
         background:linear-gradient(90deg,var(--hextech),#0A8C84)}
.ol .b.r{background:none;height:auto;font-size:.86rem;color:var(--doux);
         text-align:right;font-family:var(--corps)}
.ol .v{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.ol.slam{grid-template-columns:9.5rem 1fr 1.6rem}
.bis{margin:0;padding-left:1.2rem;line-height:1.75}
.bis li{font-size:.95rem}
.bis .pl{color:var(--hextech)} .bis .mo{color:var(--sang)}
.mv .bar{grid-column:1/-1;height:2px;margin-top:.3rem;background:rgba(31,71,102,.6)}
.mv .bar i{display:block;height:100%}
.up .bar i{background:linear-gradient(90deg,var(--or),var(--or-vif))}
.dn .bar i{background:linear-gradient(90deg,var(--sang),#8E2B36)}

/* ---------------------------------------------- jetons d'unité */
/* Coins coupés : la forme des cartouches du client League. Les noms
   d'unités sont trop longs pour tenir dans un hexagone lisible. */
.puces{display:flex;flex-wrap:wrap;gap:.4rem;margin:.65rem 0 0;padding:0;list-style:none}
.ros{display:flex;flex-wrap:wrap;gap:.4rem;margin:.15rem 0}
.puces li,.puce{
  font-size:.84rem;font-weight:500;padding:.26rem .62rem;
  background:#122A44;color:var(--doux);
  border:1px solid var(--trait);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
}
.puce.carry{background:rgba(200,170,110,.14);border-color:var(--or);
  color:var(--or-vif);font-weight:700}
.puce.miss{opacity:.4}

/* ---------------------------------------------- sélecteur de mode */
.seg{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem}
.seg button{
  font-family:var(--corps);font-size:.92rem;font-weight:600;
  background:var(--abysse);color:var(--doux);
  border:1px solid var(--trait);padding:.45rem 1rem;cursor:pointer;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);
}
.seg button:hover{color:var(--texte);border-color:var(--or-vif)}
.seg button[aria-pressed="true"]{background:var(--or);color:var(--nuit);
  border-color:var(--or);font-weight:700}

/* ---------------------------------------------- compos */
.compo{
  background:linear-gradient(180deg,var(--pierre),var(--abysse));
  border:1px solid var(--trait);padding:1.05rem 1.15rem;margin-bottom:.9rem;
}
.compo.top{border-color:var(--trait-or);box-shadow:inset 0 2px 0 var(--or)}
.compo .ligne1{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap;
  margin-bottom:.6rem}
.compo .n{font-size:1.16rem;font-weight:700;font-family:var(--titre);
  letter-spacing:.01em}
.compo .val{font-family:var(--titre);font-weight:700;color:var(--or);
  font-variant-numeric:tabular-nums;font-size:1.25rem}
.compo .lvl{font-size:.82rem;color:var(--faible)}
.compo .stats{font-size:.86rem;color:var(--doux);margin-top:.6rem;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.compo .stats b{color:var(--texte)}
.compo .stats u{color:var(--or-vif);text-decoration-color:var(--or)}
.compo .txt{font-size:.93rem;color:var(--doux);margin-top:.55rem}

/* ---------------------------------------------- recherche */
.rech{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.1rem}
.rech input{
  flex:1;min-width:210px;font-family:var(--corps);font-size:1rem;
  background:#0A1B2E;border:1px solid var(--trait);color:var(--texte);
  padding:.65rem .9rem;
}
.rech input::placeholder{color:var(--faible)}
.rech input:focus{outline:none;border-color:var(--hextech);
  box-shadow:0 0 0 1px var(--hextech)}

/* ---------------------------------------------- tableau */
.tbl{overflow-x:auto;border:1px solid var(--trait)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.55rem .8rem;
  border-bottom:1px solid rgba(31,71,102,.45);white-space:nowrap}
th{font-size:.78rem;letter-spacing:.04em;color:var(--or);
  background:#0A1B2E;font-weight:700;border-bottom-color:var(--trait-or)}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(odd){background:rgba(17,38,63,.45)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.rang{color:var(--or);font-family:var(--titre);font-weight:700}

/* ---------------------------------------------- calendrier */
.cal{display:grid;gap:.45rem}
.evt{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:center;
  padding:.65rem .95rem;background:var(--abysse);border:1px solid var(--trait)}
.evt.passe{opacity:.45}
.evt.prochain{border-color:var(--trait-or);box-shadow:inset 2px 0 0 var(--or)}
.evt .dt{font-size:.86rem;color:var(--doux);white-space:nowrap;
  font-variant-numeric:tabular-nums;font-weight:600}
.evt .nm{font-weight:500;min-width:0}
.evt .tag{font-size:.74rem;padding:.18rem .55rem;border:1px solid var(--trait);
  color:var(--faible);white-space:nowrap;font-weight:600}
.evt .tag.ok{border-color:var(--or);color:var(--or)}

/* ---------------------------------------------- distribution */
.dist{display:grid;gap:.4rem}
.dl{display:grid;grid-template-columns:2.2rem 1fr 2.2rem 3.2rem;
  gap:.6rem;align-items:center}
.dl .p{font-family:var(--titre);font-weight:700;color:var(--or);font-size:1.02rem}
/* Cinzel n'a pas de bas de casse : l'exposant y deviendrait une capitale. */
.dl .p sup{font-family:var(--corps);font-size:.58em;font-weight:600}
.dl .b{position:relative;height:16px;background:rgba(31,71,102,.38)}
.dl .b i{display:block;height:100%}
.dl .b i.pl{background:linear-gradient(90deg,#0AC8B9,#14E0CF)}
.dl .b i.mo{background:linear-gradient(90deg,#5A3F46,#8E5560)}
/* le repère du hasard */
.dl .b u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--or);
  opacity:.85;transform:translateX(-1px)}
.dl .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.dl .e{font-size:.82rem;font-variant-numeric:tabular-nums;text-align:right;
  font-weight:600}
.dl .e.pl{color:var(--hextech)} .dl .e.mo{color:var(--sang)}

.ecarts{list-style:none;padding:0;margin:1.2rem 0 0;display:grid;gap:.4rem;
  font-size:.9rem;color:var(--doux)}
.ecarts li{padding-left:1rem;position:relative}
.ecarts li::before{content:"";position:absolute;left:0;top:.52em;width:6px;height:6px;
  background:var(--or);transform:rotate(45deg)}
.ecarts b{color:var(--texte);font-weight:700}



/* ---------------------------------------------- la barre */
.barre .barre-l{grid-template-columns:1fr auto auto auto;gap:.5rem .9rem;
  align-items:baseline;padding:.45rem 0;
  border-bottom:1px solid rgba(31,71,102,.4)}
.barre .barre-l:last-child{border-bottom:0}
.barre .barre-l.entete{font-size:.78rem;color:var(--faible);border-bottom-color:var(--trait-or)}
.barre .p{font-family:var(--corps);font-weight:600;color:var(--texte);font-size:.95rem}
.barre .sien{font-family:var(--titre);font-weight:700;font-size:1.15rem;
  font-variant-numeric:tabular-nums;min-width:4.5rem;text-align:right}
.barre .sien.pl{color:var(--hextech)} .barre .sien.mo{color:var(--sang)}
.barre .cible{font-variant-numeric:tabular-nums;color:var(--doux);
  min-width:4.5rem;text-align:right}
.barre .j{font-size:.8rem;color:var(--faible);min-width:5.5rem;text-align:right}
.barre .entete .sien,.barre .entete .cible{font-family:var(--corps);
  font-size:.78rem;font-weight:600}

/* ---------------------------------------------- focus */
.focus{display:grid;gap:.4rem;margin:1.1rem 0}
.ligne-focus{display:grid;grid-template-columns:1fr auto;gap:.2rem .9rem;
  padding:.6rem .9rem;background:var(--abysse);border:1px solid var(--trait)}
.ligne-focus .nom{font-weight:700}
.ligne-focus .ec{font-family:var(--titre);font-weight:700;font-size:1.05rem;
  font-variant-numeric:tabular-nums;text-align:right}
.ligne-focus .ec.pl{color:var(--hextech)} .ligne-focus .ec.mo{color:var(--sang)}
.ligne-focus .det{font-size:.82rem;color:var(--faible);
  font-variant-numeric:tabular-nums}
.ligne-focus .verdict{font-size:.82rem;color:var(--doux);text-align:right;
  white-space:nowrap}

/* ---------------------------------------------- journal de parties */
.parties{display:grid;gap:.4rem;margin:1.1rem 0}
.partie{display:grid;grid-template-columns:auto 1fr auto;gap:.85rem;
  align-items:center;padding:.6rem .9rem;background:var(--abysse);
  border:1px solid var(--trait)}
.partie .corps{min-width:0;display:grid;gap:.35rem}
.partie .meta{font-size:.82rem;color:var(--faible);

.partie .ros{margin:0}
.partie .puce{font-size:.78rem;padding:.18rem .5rem}

/* Le placement, dans un hexagone : c'est littéralement là qu'on finit. */
.hex.mini{width:40px;aspect-ratio:1.1547/1;gap:0;padding:0}
.hex.mini .r{font-size:1.05rem}
.hex.mini.or{background:linear-gradient(165deg,#6B5427,#3E3017)}
.hex.mini.or .r{color:var(--or-vif)}
.hex.mini.ok{background:linear-gradient(165deg,#13504C,#0C2E2C)}

.hex.mini.bas{background:linear-gradient(165deg,#1B3A5C,#102338)}

@media (prefers-reduced-motion:no-preference){.hex.mini{animation:none}}

.conv{font-weight:700;font-variant-numeric:tabular-nums;font-size:1rem;
  white-space:nowrap;font-family:var(--titre)}
.conv.pl{color:var(--hextech)} .conv.mo{color:var(--sang)}
.conv.nul{color:var(--faible)}
.evt .conv{font-size:.92rem}

/* ---------------------------------------------- le champ de pivot */
/* La vue « En partie » se consulte au téléphone entre deux manches :
   le champ est la première chose touchée, et rien ne passe devant. */
.rech-grande{margin:1.4rem 0 1.1rem}
.rech-grande input{font-size:1.15rem;padding:.95rem 1.1rem;
  border-color:var(--trait-or);background:#0A1B2E}
.rech-grande input:focus{border-color:var(--or);box-shadow:0 0 0 1px var(--or)}

/* ---------------------------------------------- verdicts d'écart */
.ecarts li{display:flex;flex-wrap:wrap;align-items:baseline;gap:.5rem}
.ecarts .z{font-weight:700;font-variant-numeric:tabular-nums}
.ecarts .j{font-size:.84rem;color:var(--faible)}
.ecarts li.bon .z{color:var(--hextech)}

.ecarts li.flou::before{background:var(--faible)}

details.pourquoi{border:1px solid var(--trait);background:var(--abysse);
  padding:.75rem 1.1rem;margin-bottom:1rem}
details.pourquoi summary{cursor:pointer;font-weight:700;color:var(--or);
  font-size:.93rem;list-style:none}
details.pourquoi summary::-webkit-details-marker{display:none}
details.pourquoi summary::before{content:"▸ ";color:var(--or)}

details.pourquoi p{margin:.8rem 0 0}

footer{border-top:1px solid var(--trait);margin-top:3.5rem;padding-top:1.3rem;
  font-size:.84rem;color:var(--faible)}
.vide{color:var(--faible);font-style:italic;padding:1.4rem 0}

/* ---------------------------------------------- fiches de ligne */
.fiche-d{display:grid;grid-template-columns:10.5rem 1fr;gap:.5rem 1rem;
         margin:.9rem 0 0;padding-top:.8rem;border-top:1px solid rgba(31,71,102,.6)}
.fiche-d dt{color:var(--or);font-family:var(--titre);font-weight:700;font-size:.9rem}
.fiche-d dd{margin:0;color:var(--doux);font-size:.93rem;line-height:1.55}
.fiche-d dd b{color:var(--texte)}
.fiche-d .cmp{color:var(--faible)}
@media(max-width:560px){.fiche-d{grid-template-columns:1fr;gap:.15rem 0}
  .fiche-d dd{margin-bottom:.55rem}}
.puce .et{color:var(--or);font-size:.8em;margin-left:.2rem;letter-spacing:-.05em}
.archive{border-left:3px solid var(--faible);background:rgba(110,131,153,.08);
         padding:.8rem 1.1rem;margin:0 0 1.4rem;color:var(--doux)}
.archive b{color:var(--texte)}
.puce .ct{color:var(--faible);font-size:.78em;margin-right:.3rem;
          font-variant-numeric:tabular-nums}
.puce.carry .ct{color:var(--or)}
.avenir{display:grid;grid-template-columns:4.2rem 1fr;gap:.55rem 1rem;align-items:start}
.avenir dt{font-family:var(--titre);font-weight:700;color:var(--or)}
.avenir dd{margin:0;display:flex;flex-wrap:wrap;gap:.35rem}
.avenir .puce small{color:var(--faible);margin-left:.35rem;font-size:.82em}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="marque">
      <b>ORACLE<span class="pt">·</span>TFT</b>
      <span class="sub" id="hsub">chargement…</span>
    </div>
    <nav role="tablist" aria-label="Sections">
      <button role="tab" data-vue="avant"   aria-selected="true">Avant</button>
      <button role="tab" data-vue="fiches"  aria-selected="false">Fiches</button>
      <button role="tab" data-vue="apres"   aria-selected="false">Après</button>
      <button role="tab" data-vue="suivi"   aria-selected="false">Suivi</button>
    </nav>
  </div>
</header>

<main>
  <section class="vue" id="v-avant"></section>
  <section class="vue" id="v-fiches" hidden></section>
  <section class="vue" id="v-apres" hidden></section>
  <section class="vue" id="v-suivi" hidden></section>
  <footer>
    <p class="faible" id="pied">Données : tactics.tools. Projet personnel, sans lien avec Riot Games.</p>
  </footer>
</main>

<script>
/* ===================================================================
   Le site ne contient AUCUNE donnée de jeu. Tout vient de data/.
   C'est le point de couture : en v2, ces trois URL deviendront des
   routes d'API et rien d'autre ne changera.
   =================================================================== */
const SOURCES = {
  meta:       "data/meta/courant.json",
  profil:     "data/profil.json",
  calendrier: "data/calendrier.json",
  miroir:     "data/miroir.json",
  focus:      "data/focus.json",
  barre:      "data/barre.json",
  // Relevé huit fois par jour par le workflow. data/profil.json, lui, est
  // écrit à la main : son LP datait du 22 octobre quand le vrai valait 39.
  // Toute lecture de position passe désormais par ici, avec profil en repli.
  joueur:     "data/joueur.json",
  objets:     "data/objets.json",
  compos_lui: "data/compos_lui.json",
  // ⚠ Ces deux-là ne sont NI mesurés ni relevés : un guide transcrit et un
  // raisonnement. Ils ont leur propre rendu (.ref) pour qu'on ne les
  // confonde jamais avec le reste, et une garde de set qui les cache quand
  // ils périment.
  fondamentaux: "data/reference/fondamentaux.json",
  augments:     "data/reference/augments.json",
  fuites:       "data/fuites.json",
  // N'existe qu'après une collecte sur sa machine. Le bloc est
  // gardé : il apparaîtra tout seul au prochain LANCER.bat.
  contestation: "data/contestation.json"
};
const D = {};              // données chargées
const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nb = n => (n ?? 0).toLocaleString("fr-FR").replace(/ | /g, " ");
const fdate = iso => { if(!iso) return "—";
  const [a,m,j] = iso.split("-"); return `${j}/${m}/${a}`; };

/* ══ LE SET COURANT, LES NOMS, LA GARDE ═══════════════════════════════════
 * Trois choses que chaque bloc refaisait à sa façon jusqu'au 10/11, et que
 * la répétition générale du 1er décembre a prises en défaut :
 *
 *   le set courant   se lisait dans le libellé de patch de compos_lui.json,
 *                    avec repli sur le relevé manuel. Le jour d'un changement
 *                    de set, l'un et l'autre répondaient « 18 ».
 *   les noms         retiraient « DA_ » et « 18 » dans une expression
 *                    régulière : « Ezreal19 » le 1er décembre.
 *   l'absence        un bloc sans données ne rendait rien du tout — et un bloc
 *                    aux données d'un AUTRE set rendait tout, sans étiquette.
 *
 * Tout passe désormais par meta/courant.json, que build_site.py construit à
 * partir du dernier relevé automatique. */
function setCourant(){ return D.meta?.set ?? null; }

const nomU = id => esc(D.meta?.noms?.[id]
  ?? String(id ?? "").replace(/^[A-Za-z]{2,4}\d*_/, "").replace(/\d+/g, "")
       .replace(/_/g, " ").replace(/([a-z])([A-Z])/g, "$1 $2").trim());

/* « DIAMOND II » est le code brut de la source : on affiche le palier. */
const PALIERS_FR = {IRON:"Fer", BRONZE:"Bronze", SILVER:"Argent", GOLD:"Or",
  PLATINUM:"Platine", EMERALD:"Émeraude", DIAMOND:"Diamant", MASTER:"Master",
  GRANDMASTER:"Grandmaster", CHALLENGER:"Challenger"};
function palierFr(brut){
  const [t, d] = String(brut || "").split(" ");
  if(!PALIERS_FR[t]) return esc(brut || "");
  // Au-dessus de Diamant il n'y a qu'une division : le « I » n'apprend rien.
  return PALIERS_FR[t] + (d && !["MASTER","GRANDMASTER","CHALLENGER"].includes(t) ? " " + d : "");
}

/* Un bloc n'a rien à montrer pour trois raisons, et elles ne se disent pas
 * pareil. Renvoie le HTML à afficher À LA PLACE du bloc, ou null si le bloc
 * peut s'afficher normalement. */
const ETATS_SAINS = ["ok", "ouvert", "classe"];
function garde(o, titre, siAbsent){
  const sc = setCourant();
  if(!o) return siAbsent ? `<h2>${titre}</h2><div class="vide">${siAbsent}</div>` : "";
  if(o.etat && !ETATS_SAINS.includes(o.etat) && (o.message || o.etat_note))
    return `<h2>${titre}</h2><div class="note">${esc(o.message || o.etat_note)}</div>`;
  if(o.set != null && sc != null && o.set !== sc)
    return `<h2>${titre}</h2><div class="note">Ce bloc date du <b>Set ${o.set}</b> ;
      le relevé courant est celui du Set ${sc}. Il n'est pas affiché : il reviendra
      de lui-même quand ses données seront du set en cours.</div>`;
  return null;
}

/* -------------------------------------------------- chargement */
async function charger(){
  const res = {};
  for(const [cle, url] of Object.entries(SOURCES)){
    try {
      const r = await fetch(url, {cache: "no-store"});
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      res[cle] = await r.json();
    } catch(e){
      res[cle] = null;
      console.warn(`${cle} illisible :`, e.message);
    }
  }
  Object.assign(D, res);
}

/* -------------------------------------------------- utilitaires */
function ligneMouvement(m, sens){
  const d = Math.abs(m.delta);
  const pct = Math.min(100, d / 40 * 100);
  return `<div class="mv ${sens}">
    <span class="nom">${esc(m.nom)}</span>
    <span class="rg">${m.rang_avant}<sup>e</sup> → ${m.rang_apres}<sup>e</sup>
      · ${m.avg_avant.toFixed(2)} → ${m.avg_apres.toFixed(2)}</span>
    <span class="d">${sens === "up" ? "−" : "+"}${d}</span>
    <span class="bar"><i style="width:${pct}%"></i></span></div>`;
}

/* ══ LA FICHE DE LIGNE ════════════════════════════════════════════════════
 * Ce qu'on prépare AVANT de lancer une partie : les porteurs, le niveau, les
 * objets à viser et donc les composants à ramasser, ce qui la fait gagner.
 *
 * ⚠ Jusqu'au 10/11 cet onglet s'appelait « En partie » et portait un champ
 * « les unités que tu as en main », qui classait les lignes accessibles. Il a
 * été retiré, pour deux raisons qui se rejoignent :
 *
 *   1. La politique de Riot pour les outils TFT interdit les recommandations
 *      fondées sur l'état d'une partie en cours. Un champ qu'on remplit à la
 *      main avec son banc y entre de plein droit — et ce site est public, avec
 *      une demande de clé de production en vue.
 *   2. Il reposait sur des compos saisies à la main avec leur plateau. Au
 *      Set 19 personne ne les saisira le jour du patch.
 *
 * Une fiche est statique et identique pour tout le monde : elle ne prend
 * aucune entrée. C'est un document de préparation, pas un assistant. */
function ficheLigne(f, mode, premier){
  const M = D.meta.modes[mode];
  const val = f[M.cle];
  const porteurs = new Set((f.porteurs || []).map(p => p.id));
  const etoiles = n => n ? `<span class="et">${"★".repeat(n)}</span>` : "";

  // Le plateau : les unités présentes sur au moins un plateau sur trois.
  const plateau = (f.plateau || []).filter(u => (u.part ?? 0) >= .33).map(u =>
    `<span class="puce${porteurs.has(u.id) ? " carry" : ""}">${
      u.cout ? `<span class="ct" title="coût">${u.cout}</span>` : ""}${esc(u.nom)}${
      u.etoiles >= 3 || porteurs.has(u.id) ? etoiles(u.etoiles) : ""}</span>`).join("");

  const conteste = f.par_lobby == null ? ""
    : f.par_lobby >= .45 ? ` <span style="color:var(--sang)">— très contestée</span>`
    : f.par_lobby <= .12 ? ` <span style="color:var(--hextech)">— peu contestée</span>` : "";
  const sv = (k, t) => k === M.cle ? `<u>${t}</u>` : t;

  const objets = (f.porteurs || []).filter(p => f.objets?.[p.id]?.length).map(p =>
    `<b>${esc(p.nom)}</b> : ${f.objets[p.id].map(o =>
      `${esc(o.nom)}${o.composants?.length
        ? ` <span class="cmp">(${esc(o.composants.join(" + "))})</span>` : ""}`).join(", ")}`
  ).join("<br>");
  const composants = (f.composants || []).map(c =>
    c.fois > 1 ? `${esc(c.composant)} ×${c.fois}` : esc(c.composant)).join(" · ");
  const trois = (f.porteurs || []).filter(p => (p.part_trois_etoiles ?? 0) >= .2).map(p =>
    `<b>${esc(p.nom)}</b> en ★★★ sur ${Math.round(100 * p.part_trois_etoiles)} % des plateaux`
  ).join(" · ");
  const niveaux = (f.niveaux || []).filter(n => (n.part ?? 0) >= .1).map(n =>
    `niveau <b>${n.niveau}</b> (${Math.round(100 * n.part)} %)`).join(", ");
  const victoire = (f.victoire || []).map(w =>
    `${w.unites.map(u => `<b>${esc(u.nom)}</b>${u.etoiles ? " " + "★".repeat(u.etoiles) : ""}`).join(" + ")}
     — place ${w.place} sur ${nb(w.n)} parties`).join("<br>");

  // Ce que LUI en connaît, si ses parties sont du même set que le relevé.
  const L = (D.compos_lui?.etat ?? "ok") === "ok" && D.compos_lui?.set === setCourant()
    ? (D.compos_lui.compos || []).find(x => x.code === f.code) : null;
  const toi = !L ? "" : [
    L.porteurs_reguliers?.length ? `tu joues ${L.porteurs_reguliers.map(nomU).join(", ")}` : "",
    L.porteurs_occasionnels?.length ? `déjà sorti ${L.porteurs_occasionnels.map(nomU).join(", ")}` : "",
    L.porteurs_jamais_joues?.length ? `jamais joué ${L.porteurs_jamais_joues.map(nomU).join(", ")}` : "",
  ].filter(Boolean).join(" · ");

  const dl = [
    ["Porteurs et objets", objets],
    ["Composants à ramasser", composants],
    ["Niveau", niveaux],
    ["Trois étoiles", trois],
    ["Ce qui la fait gagner", victoire],
    ["Traits", (f.traits || []).slice(0, 4).map(t => `${esc(t.nom)} ${t.palier ?? ""}`).join(" · ")],
    ["Toi", toi ? toi.charAt(0).toUpperCase() + toi.slice(1) + "." : ""],
  ].filter(([, v]) => v).map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join("");

  return `<article class="compo${premier ? " top" : ""}">
    <div class="ligne1">
      <span class="n">${esc(f.nom)}</span>
      <span class="val">${val == null ? "—" : (M.cle === "lp" && val > 0 ? "+" : "")
        + val.toFixed(M.cle === "lp" ? 2 : 1)}${M.unite}</span>
      <span class="lvl">${esc(f.type_libelle || "")}</span>
    </div>
    <div class="ros">${plateau}</div>
    <div class="stats">
      ${f.lp != null ? sv("lp", `<b>${f.lp > 0 ? "+" : ""}${f.lp} LP</b> par partie`) + " · " : ""}
      placement <b>${f.place ?? "—"}</b> ·
      ${f.top4 != null ? sv("top4", `top 4 <b>${f.top4} %</b>`) + " · " : ""}
      ${f.premieres != null ? sv("premieres", `1<sup>res</sup> <b>${f.premieres} %</b>`) + " · " : ""}
      ${f.par_lobby != null ? `${String(f.par_lobby).replace(".", ",")} joueur par lobby${conteste} · ` : ""}
      ${nb(f.n)} parties
    </div>
    ${dl ? `<dl class="fiche-d">${dl}</dl>` : ""}
  </article>`;
}


/* ===================================================================
   LES QUATRE VUES
   -------------------------------------------------------------------
   Organisées selon les MOMENTS D'USAGE, pas selon la structure du
   projet. Avant / Pendant / Après sont les trois instants où l'outil
   sert ; Suivi est de la veille, qu'on consulte quand on veut.

   L'ancienne organisation (méta / préparer / outils / profil) décrivait
   le projet à lui-même : trois onglets sur quatre se lisaient une fois.
   =================================================================== */

/* -------------------------------------------------- AVANT la partie */
let MODE = "ladder";
const LIBMODE = {ladder:"Ladder", cumule:"Points cumulés", checkmate:"Checkmate"};


/* -------------------------------------------------- le focus */
/* Croise ses parties et la méta. La colonne décisive n'est pas l'écart :
   c'est « il faudrait N parties », qui transforme « on ne sait pas » en
   « voilà ce qu'il faudrait pour savoir ». */
function blocFocus(){
  const f = D.focus;
  const g = garde(f, "Sur quoi te concentrer");
  if(g !== null) return g;
  const L = f.lignes || [];
  const jamais = (f.fortes_peu_contestees || []).filter(x => !x.il_la_joue);
  const solides = L.filter(l => l.solide);

  const ligne = l => {
    const sens = l.ecart_corrige < 0 ? "pl" : "mo";
    return `<div class="ligne-focus">
      <span class="nom">${nomU(l.nom)}</span>
      <span class="ec ${sens}">${l.ecart_corrige > 0 ? "+" : "−"}${Math.abs(l.ecart_corrige).toFixed(2)}</span>
      <span class="det">${l.n} parties · pick ${l.pick} % du ladder</span>
      <span class="verdict">${l.solide ? "hors du bruit"
        : `il faudrait ${nb(l.parties_requises)} parties`}</span>
    </div>`;
  };

  return `<h2>Sur quoi te concentrer</h2>
    <p class="doux">Ton placement avec chaque unité, comparé à celui du ladder avec la
      même unité, <b>moins ton avantage général de ${Math.abs(f.lui.avantage_general).toFixed(2)}
      place</b> — sans quoi toutes tes lignes paraîtraient bonnes.</p>

    ${solides.length === 0 ? `<div class="note warn"><b>Aucune de tes ${L.length} lignes
      ne sort du bruit à ${f.lui.parties} parties.</b> Ce n'est pas un échec de mesure :
      c'est la mesure. La dernière colonne dit ce qu'il faudrait pour trancher — et c'est
      le même volume que celui qui mène à Challenger.</div>` : ""}

    <div class="focus">${L.map(ligne).join("")}</div>

    <h2>Fortes et peu contestées</h2>
    <p class="doux">Bon placement, et peu présentes dans les lobbies. À placement égal,
      la ligne la moins contestée gagne.</p>
    <div class="cal">${(f.fortes_peu_contestees || []).map(x => `<div class="evt${x.il_la_joue ? " prochain" : ""}">
      <span class="dt">${x.avg.toFixed(2)}</span>
      <span class="nm">${nomU(x.nom)} <span class="faible">— pick ${x.pick} %</span></span>
      <span class="tag${x.il_la_joue ? " ok" : ""}">${x.il_la_joue ? "tu la joues" : "jamais jouée"}</span>
    </div>`).join("")}</div>
    ${jamais.length === 0 ? `<p class="faible"><b>Tu les joues déjà toutes.</b>
      Aucun gisement inexploité : ta sélection de lignes est saine.</p>` : ""}

    <details class="pourquoi">
      <summary>Ce que cette page ne peut pas dire</summary>
      ${Object.values(f.reserves || {}).map(r => `<p class="faible">${esc(r)}</p>`).join("")}
    </details>`;
}

/* Les compos, classées par ce qu'elles RAPPORTENT et par ce qu'il sait déjà
 * piloter. Un placement décrit une performance ; le LP décrit un classement,
 * et c'est le classement qui est l'objectif. */
function blocCompos(){
  const C = D.compos_lui;
  const g = garde(C, "Les compos, par ce qu'elles rapportent");
  if(g !== null) return g;
  if(!C?.compos?.length) return "";

  // Les identifiants de victoire portent leurs étoiles (« …Krug-3 »).
  const nom = u => { const [id, et] = String(u).split(/-(?=\d$)/);
                     return nomU(id) + (et ? " " + "★".repeat(+et) : ""); };

  const cartes = C.compos.map(c => {
    const part = Math.round(100 * (c.part_porteurs_connus || 0));
    // Trois états, pas deux. « Occasionnel » veut dire qu'il a sorti
    // l'unité sans la piloter assez pour qu'on mesure quoi que ce soit —
    // aplatir les deux ferait mentir la page, comme avant le 04/11.
    const connus = (c.porteurs_reguliers || []).map(nom).join(", ");
    const parfois = (c.porteurs_occasionnels || []).map(nom).join(", ");
    const manque = (c.porteurs_jamais_joues || []).map(nom).join(", ");
    const wc = (c.conditions_de_victoire || [])[0];
    const niv = (c.niveaux || []).slice(0, 2)
                 .map(x => `niv. ${x.niveau}`).join(" / ");
    return `<div class="carte">
      <div class="comp-t">
        <span class="lp">${c.lp_par_partie > 0 ? "+" : ""}${c.lp_par_partie} LP</span>
        <span class="faible">par partie · place ${c.place} ·
          ${nb(c.n)} parties${niv ? " · " + esc(niv) : ""}</span>
      </div>
      <div class="jauge" title="${part} % des porteurs déjà joués">
        <i style="width:${part}%"></i><span>${part} %</span>
      </div>
      <p class="faible" style="margin:.6rem 0 0">
        ${connus ? `<b>Tu joues</b> ${connus}.` : ""}
        ${parfois ? ` <b>Tu as déjà sorti</b> ${parfois}, sans la piloter souvent.` : ""}
        ${manque ? ` <b>Jamais joué :</b> ${manque}.` : ""}
        ${!connus && !parfois ? "<b>Aucun porteur que tu sortes.</b>" : ""}
        ${c.son_placement_sur_les_porteurs != null
          ? ` Ton placement sur ceux que tu connais : ${c.son_placement_sur_les_porteurs}
              sur ${c.parties_sur_les_porteurs} parties.` : ""}</p>
      ${wc ? `<p class="faible" style="margin:.5rem 0 0"><b>Ce qui la fait gagner :</b>
        ${(wc.unites || []).map(nom).join(" + ")} — place ${wc.place}
        sur ${nb(wc.n)} parties.</p>` : ""}
      <p class="faible" style="margin:.5rem 0 0"><b>Traits :</b>
        ${(c.traits || []).slice(0, 4).map(t =>
          `${nom(t.trait)} ${t.palier}`).join(" · ")}</p>
    </div>`;
  }).join("");

  return `<h2>Les compos, par ce qu'elles rapportent</h2>
    <p class="doux">Classées par <b>LP gagné par partie</b> et non par placement :
      un placement décrit une performance, le LP décrit un classement — et c'est le
      classement, l'objectif. La jauge dit quelle part des <b>porteurs</b> tu sors
      déjà : connaître sept unités sur huit ne sert à rien si celle qui porte les
      objets t'est étrangère. Patch ${esc(String(C.patch))},
      ${nb(C.n_parties_ladder)} parties.</p>
    <div class="grille">${cartes}</div>
    <p class="faible">⚠ La jauge mesure une <b>familiarité</b>, pas une aptitude :
      elle dit que tu as déjà sorti ces unités, pas que tu les joues bien. Et le
      LP est mesuré sur le ladder Master+, pas sur toi.
      ${esc(C.limite || "")}</p>`;
}

/* Les objets, en COMPOSANTS.
 *
 * Un objet fini ne se choisit pas, il se fabrique : on ramasse des composants
 * et on décide quoi en faire. Un classement d'objets finis par taux de
 * victoire ne répond à aucune décision réelle. Ce bloc répond aux deux qui
 * existent : que prendre au carrousel, et quel objet assembler sans rien perdre. */
function blocObjets(){
  const o = D.objets;
  const g = garde(o, "Les objets, en composants");
  if(g !== null) return g;
  if(!o?.carries?.length) return "";

  const car = (o.carrousel || []).slice(0, 6);
  const maxi = car.length ? car[0].n_carries : 1;

  // Le carrousel d'abord : c'est la décision qui revient le plus souvent.
  const barres = car.map(c => `
    <div class="ol">
      <span class="n">${esc(c.composant)}</span>
      <span class="b"><i style="width:${Math.round(100 * c.n_carries / maxi)}%"></i></span>
      <span class="v">${c.n_carries}<span class="faible">/${o.carries.length}</span></span>
    </div>`).join("");

  const slams = (o.slams_gratuits || []).slice(0, 5).map(s => `
    <div class="ol slam">
      <span class="n">${esc(s.nom)}</span>
      <span class="b r">${esc(s.composants.join(" + "))}</span>
      <span class="v">${s.n_carries}</span>
    </div>`).join("");

  const fiches = o.carries.slice(0, 6).map(c => {
    const courses = (c.composants_requis || []).map(x =>
      x.fois > 1 ? `${x.composant} ×${x.fois}` : x.composant).join(" · ");
    const bis = (c.bis || []).slice(0, 5).map(b => {
      const eff = b.effet_sur_cette_unite;
      return `<li><b>${esc(b.nom)}</b>${b.craftable
        ? ` <span class="faible">${esc(b.composants.join(" + "))}</span>` : ""}${
        eff != null ? ` <span class="${eff < 0 ? "pl" : "mo"}">${eff < 0 ? "" : "+"}${
          (eff).toFixed(3)}</span>` : ""}</li>`;
    }).join("");
    return `<div class="carte">
      <h3 style="margin:0 0 .3rem">${nomU(c.carry)}</h3>
      <p class="faible" style="margin:0 0 .7rem">Tu la sors ${c.n_parties_lui} fois
        (place ${c.sa_place}) · le ladder ${c.place_ladder} sur
        ${nb(c.n_ladder)} parties${c.etoile3
          ? ` · en 3★ : ${c.etoile3.avg} sur ${nb(c.etoile3.n)}` : ""}</p>
      <ol class="bis">${bis}</ol>
      <p class="faible" style="margin:.7rem 0 0"><b>À ramasser :</b> ${esc(courses)}</p>
    </div>`;
  }).join("");

  return `<h2>Les objets, en composants</h2>
    <p class="doux">Un objet fini ne se choisit pas, il se fabrique. Les deux seules
      décisions qui existent sont <b>quel composant prendre au carrousel</b> et
      <b>quand assembler plutôt que garder</b> — alors c'est à celles-là que ce bloc
      répond. Patch ${esc(o.patch)}, ${esc(o.rang)},
      ${nb(o.n_parties_ladder)} parties.</p>

    <div class="grille">
      <div class="carte">
        <h3 style="margin:0 0 .8rem">Au carrousel</h3>
        <p class="faible" style="margin:0 0 .8rem">Combien de <b>tes</b> carries
          ont besoin de ce composant. Celui qui en sert beaucoup reste utile quel
          que soit ton pivot ; celui qui n'en sert qu'un engage la partie.</p>
        <div class="dist">${barres}</div>
      </div>
      <div class="carte">
        <h3 style="margin:0 0 .8rem">À assembler sans rien perdre</h3>
        <p class="faible" style="margin:0 0 .8rem">Ces objets sont déjà au BiS d'un
          de tes carries : les assembler tôt ne gâche rien. <b>Tout le reste est un
          vrai arbitrage</b>, et il dépend de tes PV et de ton tempo — pas de la
          donnée.</p>
        <div class="dist">${slams}</div>
      </div>
    </div>

    <div class="grille" style="margin-top:1rem">${fiches}</div>

    ${o.fraicheur?.patch_frais ? `<div class="note warn">${esc(o.fraicheur.avertissement)}</div>` : ""}

    <p class="faible">⚠ Le BiS est un classement de <b>fréquence</b>, pas d'effet :
      ce sont les objets les plus portés sur l'unité, pas forcément ceux qui la
      font le mieux placer. Quand la source donne un effet mesuré, il est affiché
      à côté — un nombre négatif veut dire meilleur placement.</p>`;
}

function vueAvant(){
  const m = D.meta;
  if(!m) return `<div class="note warn"><b>Données indisponibles.</b>
    Relance <code>python3 tools/build/build_site.py</code>.</div>`;
  const top = (m.compos || []).slice(0, 3);

  return `<h1>Ce que tu joues ce patch</h1>
    ${m.volume?.frais && m.volume.note
      ? `<div class="note warn"><b>Patch ${esc(m.releve.patch)}, encore frais.</b>
          ${esc(m.volume.note)}</div>` : ""}
    ${(() => {
      // Les trois blocs croisent SES parties et la méta. Quand ses parties
      // sont d'un autre set, ils refusent tous les trois pour la même raison :
      // on le dit une fois, pas trois.
      const croises = [D.focus, D.compos_lui, D.objets];
      if(croises.every(o => o?.etat === "sets_differents"))
        return `<div class="note"><b>Tes parties récoltées sont du Set
          ${D.focus.sets?.parties}, la méta relevée est celle du Set ${m.set}.</b>
          Le focus, les compos par familiarité et les objets de tes carries
          croisent les deux : ils ne se calculent pas entre deux sets, et
          reviendront à ta première récolte du Set ${m.set}
          (<code>LANCER.bat</code>, après quelques parties classées).
          En attendant, les fiches et le classement ci-dessous ne dépendent
          pas de toi : ils sont à jour.</div>`;
      return blocFocus() + blocCompos() + blocObjets();
    })()}

    ${top.length ? `<h2>Les lignes qui rapportent</h2>
      <p class="doux">Les ${top.length} premières du relevé, par LP gagné par partie.
        Chacune a sa fiche complète — objets, composants, niveau — dans
        l'onglet <a href="#fiches">Fiches</a>.</p>
      <div class="cal">${top.map(f => `<div class="evt">
        <span class="dt">${f.lp != null ? (f.lp > 0 ? "+" : "") + f.lp : "—"}</span>
        <span class="nm">${esc(f.nom)} <span class="faible">— ${esc(f.type_libelle || "")}</span></span>
        <span class="tag">place ${f.place ?? "—"}</span></div>`).join("")}</div>` : ""}

    <details class="pourquoi">
      <summary>Le classement complet des unités</summary>
      <p class="faible">Ce tableau porte un <b>biais de survie</b> : il décrit des
        plateaux finaux. Avoir une unité à 5 coûts sur son plateau veut surtout dire
        que la partie se passait bien. Il sert à repérer un mouvement, pas à choisir
        quoi jouer — c'est à ça que servent les fiches.</p>
      ${m.unites?.length ? `<div class="tbl"><table>
        <thead><tr><th>#</th><th>Unité</th><th class="num">Placement</th>
          <th class="num">1<sup>res</sup></th><th class="num">Parties</th></tr></thead>
        <tbody>${m.unites.map(u => `<tr>
          <td class="rang">${u.rang}</td><td>${esc(u.nom)}${
            u.cout ? ` <span class="faible">· ${u.cout}</span>` : ""}</td>
          <td class="num">${u.avg.toFixed(2)}</td>
          <td class="num">${u.wr.toFixed(1)} %</td>
          <td class="num">${nb(u.n)}</td></tr>`).join("")}</tbody>
      </table></div>`
      : `<div class="vide">Aucune unité ne dépasse encore
          ${nb(m.volume?.seuil_par_unite)} parties sur ce patch
          (${nb(m.releve.n_parties)} parties relevées en tout). Le classement
          apparaîtra de lui-même.</div>`}
    </details>`;
}

/* -------------------------------------------------- LES FICHES */
/* Se lit avant de lancer une partie. Aucune saisie : voir ficheLigne(). */
function vueFiches(){
  const m = D.meta;
  if(!m) return `<div class="note warn">Données indisponibles.</div>`;
  const M = m.modes[MODE];
  const t = m.tete_stable;
  const parId = Object.fromEntries((m.unites || []).map(u => [u.id, u]));
  const parCode = Object.fromEntries((m.compos || []).map(f => [f.code, f]));
  const src = m.compos_source;

  return `<h1>Tes fiches de ligne</h1>
    <p class="doux">Une fiche se lit <b>avant</b> de lancer une partie : on choisit
      ses deux ou trois lignes, on retient leurs porteurs et les composants qu'elles
      demandent, et on entre en partie avec un plan. Elles sont les mêmes pour tout
      le monde — rien ici ne dépend de ce qui se passe dans ta partie.
      ${src ? `Patch ${esc(m.releve.patch)}, ${nb(src.n_parties)} parties
        (${esc(m.releve.rang)}), relevé du ${fdate(src.date)}.` : ""}</p>

    ${m.compos?.length ? `
    <div class="seg" role="group" aria-label="Enjeu">
      ${Object.keys(m.modes).map(k => `<button data-mode="${k}"
        aria-pressed="${k === MODE}">${LIBMODE[k]}</button>`).join("")}
    </div>
    <div class="note"><b>${LIBMODE[MODE]}</b> — classé par ${esc(M.critere)}.
      ${esc(M.pourquoi)}</div>
    ${M.classement.map((code, i) => ficheLigne(parCode[code], MODE, i === 0)).join("")}
    ${m.volume?.frais ? `<div class="note warn">Patch encore frais : l'ordre des
      objets et des lignes peut bouger d'un relevé à l'autre.</div>` : ""}
    <p class="faible">⚠ ${esc(src?.limite || "")} Les objets listés sont les plus
      <b>portés</b> sur chaque porteur — une fréquence, pas un effet mesuré. Une
      compo est dite « trois étoiles » quand un de ses porteurs est en trois
      étoiles sur plus de la moitié des plateaux relevés.</p>`
    : `<div class="note">${esc(m.compos_etat || "Aucune compo dans le relevé courant.")}</div>`}

    ${t && t.unites.length ? `
    <h2>Toujours bonnes</h2>
    <p class="faible">Ces ${t.unites.length} unités occupent la tête sur les
      ${t.n_releves} patchs relevés de ce set. Une ligne construite autour d'elles
      vieillit mieux qu'une autre.</p>
    <div class="ruche">${[...t.unites]
      .sort((a,b) => (parId[a.id]?.rang ?? 99) - (parId[b.id]?.rang ?? 99))

        const u = parId[x.id];
        return `<div class="hex">
          <span class="r">${u ? u.rang : "—"}</span>
          <span class="u">${esc(x.nom)}</span>
          <span class="a">${u ? u.avg.toFixed(2) : ""}</span>
        </div>`;
      }).join("")}</div>` : ""}
    ${blocFondamentaux()}
    ${blocAugments()}`;
}

/* ══ LA DONNÉE QUI N'EN EST PAS ═══════════════════════════════════════════
 * Quatre natures dans ce projet, de la plus forte à la plus faible :
 *   mesure       on a compté, avec un seuil de bruit
 *   releve       on a copié une source publique
 *   reference    on a transcrit un guide
 *   raisonnement on a réfléchi, et ça se discute
 * Les deux dernières s'affichent en .ref : fond, bordure et bandeau distincts.
 * Sans ça, dans trois semaines, personne ne saura plus lequel est lequel. */

function enTeteRef(o, titre, sousTitre){
  const sc = setCourant();
  // Périmé : on n'affiche pas le contenu — mais on DIT qu'il existe et
  // pourquoi il manque. Un bloc qui disparaît sans un mot le jour du
  // changement de set, c'est une question que personne ne pensera à poser.
  if(o?.set && sc && o.set !== sc) return {perime: `<h2>${titre}</h2>
    <div class="note">Cette référence a été transcrite pour le <b>Set ${o.set}</b>.
      Elle est masquée tant qu'elle n'a pas été revérifiée sur le Set ${sc} :
      mieux vaut un bloc absent qu'un chiffre faux.</div>`};
  const lib = o?.nature === "raisonnement" ? "raisonnement, pas mesure"
            : "guide transcrit, pas mesure";
  return `<h2>${titre}</h2>
    <p class="doux">${sousTitre}</p>
    <div class="ref"><div class="ref-b">${lib}</div>`;
}

function blocFondamentaux(){
  const o = D.fondamentaux;
  const tete = enTeteRef(o, "Les chiffres du jeu",
    `Les cotes de boutique rendent une relance calculable, et les timings donnent des
     repères. <b>Rien ici ne vient de tes parties</b> — ce sont des constantes du
     set ${o?.set ?? ""}, transcrites depuis un guide.`);
  if(!tete) return "";
  if(tete.perime) return tete.perime;

  const c = o.cotes_boutique;
  const lignes = Object.entries(c.par_niveau).map(([niv, v]) =>
    `<tr><th>${niv}</th>${v.map((x, i) =>
      // Colonne des 4-coûts (indice 3) : son saut au niveau 8 est la seule
      // raison pour laquelle le « 8 rapide » existe. Un seuil uniforme
      // surlignait les 1-coûts, c'est-à-dire le contraire de l'information.
      `<td class="${i === 3 && x >= 10 ? "fort" : (x === 0 ? "nul" : "")}">${x ? x : "·"}</td>`
    ).join("")}</tr>`).join("");

  // Un remplacement d'underscores ne rend pas les accents : « serie de
  // victoires » s'affichait sans accent. Les libellés sont écrits.
  const LIBT = {
    serie_de_victoires: "Série de victoires", serie_de_defaites: "Série de défaites",
    serie_mixte: "Série mixte", reroll_1_cout: "Compo trois étoiles, 1-coût",
    reroll_2_couts: "Compo trois étoiles, 2-coûts",
    reroll_3_couts: "Compo trois étoiles, 3-coûts"};
  const tim = Object.entries(o.timings)
    .filter(([k]) => !k.startsWith("_"))
    .map(([k, t]) => {
      const m = t.montees ? Object.entries(t.montees)
        .map(([r, n]) => `${r} → <b>${n}</b>`).join(" · ") : esc(t._regle || "");
      return `<p style="margin:.45rem 0"><b>${esc(LIBT[k] || k.replace(/_/g, " "))}</b>
        <span class="faible">${esc(t._quand || "")}</span><br>${m}
        ${t._condition ? `<span class="faible">${esc(t._condition)}</span>` : ""}</p>`;
    }).join("");

  return tete + `
    <div class="grille">
      <div>
        <h3 style="margin:0 0 .6rem">Cotes de boutique</h3>
        <table class="cotes">
          <tr><th>niv.</th>${c.colonnes.map(x =>
            `<th>${esc(x.replace(" coûts", "c").replace(" coût", "c"))}</th>`).join("")}</tr>
          ${lignes}
        </table>
        <p class="faible" style="margin:.7rem 0 0"><b>Lis la colonne des
          4-coûts :</b> ${Object.entries(c.par_niveau).map(([niv, v]) =>
            niv === "8" ? `<b>${v[3]}</b>` : v[3]).join(" · ")}. Le saut entre le
          niveau 7 (${c.par_niveau["7"]?.[3]} %) et le niveau 8
          (${c.par_niveau["8"]?.[3]} %) est toute la raison d'être du « 8 rapide ».</p>
        <p class="faible" style="margin:.5rem 0 0">Exemplaires de chaque unité dans
          le pool partagé : ${Object.entries(o.taille_pool)
            .filter(([k]) => !k.startsWith("_"))
            .map(([k, v]) => `${k}c → ${v}`).join(" · ")}. C'est ce qui rend une
          unité contestée.</p>
      </div>
      <div>
        <h3 style="margin:0 0 .6rem">Quand monter</h3>
        ${tim}
      </div>
    </div>
    <p class="faible" style="margin:1rem 0 0">${
      (o.ce_que_ce_fichier_ne_dit_pas || []).map(esc).join(" ")}</p>
    <p class="faible">Source : ${(o.sources || []).map(s =>
      `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.nom)}</a>`
      ).join(", ")}, relevé le ${fdate(o.releve_le)}.</p>
    </div>`;
}

function blocAugments(){
  const o = D.augments;
  const tete = enTeteRef(o, "Les augments",
    "Aucun chiffre n'existe, pour personne. Ce qui suit est un cadre de décision.");
  if(!tete) return "";
  if(tete.perime) return tete.perime;
  const p = o.pourquoi_pas_de_chiffres || {};
