<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oracle TFT</title>
<style>
/* ============================================================
   ORACLE TFT — identité visuelle
   ------------------------------------------------------------
   TFT est un auto-chess, mais son plateau est HEXAGONAL. Le damier
   est la blague du nom « lolchess » ; l'hexagone est la vraie forme
   du jeu. C'est lui qui porte l'identité, et il ne sert que là où
   une unité se pose — jamais en décor.

   Palette : celle du client League. Nuit bleue, or, turquoise
   hextech. Angles vifs partout : l'interface de League ne connaît
   pas l'arrondi, elle coupe ses coins.
   ============================================================ */
@import url("https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap");

:root{
  --nuit:#091428;      /* fond, le bleu du client League */
  --abysse:#0C1C32;    /* panneaux */
  --pierre:#11263F;    /* panneaux en relief, tuiles */
  --trait:#1F4766;     /* hairline hextech */
  --trait-or:#5A4A2A;  /* hairline dorée, discrète */

  --texte:#F0E6D2;     /* le parchemin de League */
  --doux:#A5B6C6;
  --faible:#6E8399;

  --or:#C8AA6E;        /* l'or de League */
  --or-vif:#E8D5A3;
  --hextech:#0AC8B9;   /* le turquoise */
  --sang:#C4414E;      /* ce qui tombe */

  --titre:"Cinzel",Georgia,serif;
  --corps:"Barlow",system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  color-scheme:dark;
}

*{box-sizing:border-box}

body{
  background:var(--nuit);
  color:var(--texte);
  font-family:var(--corps);
  margin:0;line-height:1.6;
  -webkit-text-size-adjust:100%;
  /* Le plateau, en filigrane. Hexagones à sommet plat — la forme réelle des
     cases de TFT — sur une tuile qui se répète sans couture (3s par √3·s).
     Assez basse pour ne jamais concurrencer le texte. */
  background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='45' height='25.98' viewBox='0 0 45 25.98'><path d='M15 0L7.5 12.99L-7.5 12.99L-15 0L-7.5 -12.99L7.5 -12.99ZM60 0L52.5 12.99L37.5 12.99L30 0L37.5 -12.99L52.5 -12.99ZM15 25.98L7.5 38.97L-7.5 38.97L-15 25.98L-7.5 12.99L7.5 12.99ZM60 25.98L52.5 38.97L37.5 38.97L30 25.98L37.5 12.99L52.5 12.99ZM37.5 12.99L30 25.98L15 25.98L7.5 12.99L15 0L30 0Z' fill='none' stroke='%231F4766' stroke-opacity='.3' stroke-width='1'/></svg>");
  background-size:78px 45.03px;
  background-attachment:fixed;
}

/* ---------------------------------------------- en-tête + onglets */
header{
  position:sticky;top:0;z-index:19;
  background:linear-gradient(180deg,#0B1A2E 0%,#091428 100%);
  border-bottom:1px solid var(--trait);
  box-shadow:0 1px 0 rgba(200,170,110,.18);
}
.hwrap{max-width:1120px;margin:0 auto;padding:.85rem 20px .15rem}

.marque{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap}
.marque b{
  font-family:var(--titre);font-weight:700;font-size:1.5rem;
  letter-spacing:.12em;color:var(--or-vif);
}
.marque .pt{color:var(--hextech)}
.marque .sub{
  font-size:.82rem;color:var(--faible);font-weight:500;
  font-variant-numeric:tabular-nums;
}

nav{display:flex;gap:.35rem;overflow-x:auto;margin-top:.6rem;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{
  font-family:var(--corps);font-size:.95rem;font-weight:600;
  background:none;border:0;color:var(--doux);
  padding:.5rem .95rem .55rem;cursor:pointer;white-space:nowrap;
  position:relative;transition:color .12s;
}
nav button:hover{color:var(--texte)}
/* L'onglet actif est une tuile aux coins coupés, pas un soulignement. */
nav button[aria-selected="true"]{
  color:var(--nuit);font-weight:700;background:var(--or);
  clip-path:polygon(7px 0,100% 0,calc(100% - 7px) 100%,0 100%);
}
nav button:focus-visible{outline:2px solid var(--hextech);outline-offset:-2px}

main{max-width:1120px;margin:0 auto;padding:2rem 20px 4.5rem}
.vue[hidden]{display:none!important}

/* ---------------------------------------------- typographie */
h1{
  font-family:var(--titre);font-weight:700;
  font-size:clamp(2rem,5vw,3.1rem);line-height:1.08;
  margin:0 0 .6rem;letter-spacing:.015em;color:var(--texte);
  text-wrap:balance;
}
h2{
  font-family:var(--titre);font-weight:700;
  font-size:clamp(1.3rem,2.9vw,1.75rem);line-height:1.15;
  margin:3rem 0 1rem;letter-spacing:.03em;color:var(--or-vif);
  text-wrap:balance;
  display:flex;align-items:center;gap:.8rem;
}
/* Le filet doré qui prolonge chaque titre : séparateur, pas ornement. */
h2::after{content:"";flex:1;height:1px;
  background:linear-gradient(90deg,var(--trait-or),transparent)}
h3{font-size:1.05rem;margin:0 0 .45rem;font-weight:700;color:var(--or-vif);
  font-family:var(--corps);letter-spacing:.01em}

p{margin:0 0 .95rem;max-width:70ch}
.doux{color:var(--doux);font-size:1.02rem}
.faible{color:var(--faible);font-size:.9rem}
a{color:var(--hextech);text-underline-offset:3px}
a:hover{color:var(--or)}

code{font-family:var(--mono);font-size:.86em;background:#0A1B2E;
  padding:.14em .45em;border:1px solid var(--trait);color:var(--or-vif)}
pre{font-family:var(--mono);font-size:.82rem;background:#0A1B2E;
  border:1px solid var(--trait);border-left:2px solid var(--or);
  padding:.9rem 1.05rem;overflow-x:auto;margin:0 0 1.1rem;line-height:1.5}
pre code{background:none;border:0;padding:0;color:var(--doux)}

/* ---------------------------------------------- panneaux */
/* Angles vifs, filet fin, et une arête dorée en haut quand le bloc
   compte plus que les autres. L'arête encode, elle ne décore pas. */
.carte{
  background:linear-gradient(180deg,var(--pierre) 0%,var(--abysse) 100%);
  border:1px solid var(--trait);
  padding:1.2rem 1.3rem;margin-bottom:1rem;position:relative;
}
.grille{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}

.chiffre{
  font-family:var(--titre);font-weight:700;
  font-size:clamp(2.7rem,7vw,4.2rem);line-height:.95;
  color:var(--or);font-variant-numeric:tabular-nums;
}
.chiffre.sm{font-size:clamp(1.9rem,4vw,2.5rem)}
.unite{font-size:.86rem;color:var(--doux);margin-top:.4rem;font-weight:500}

.note{
  border-left:2px solid var(--hextech);
  background:linear-gradient(90deg,rgba(10,200,185,.09),rgba(10,200,185,.01));
  padding:.8rem 1.05rem;margin:0 0 1.1rem;font-size:.96rem;
}
.note.warn{border-left-color:var(--or);
  background:linear-gradient(90deg,rgba(200,170,110,.11),rgba(200,170,110,.01))}
.note b{color:var(--or-vif)}

/* ---------------------------------------------- la ruche */
/* Les huit unités qui ne quittent jamais la tête, posées comme sur
   le plateau : hexagones à sommet plat, rangée décalée. Chaque hexagone
   porte le rang courant de l'unité — de l'information, pas un médaillon. */
/* Une rangée droite, comme une ligne du plateau. Pas de décalage alterné :
   sur une seule rangée il produit un zigzag, pas un damier. */
.ruche{display:flex;flex-wrap:wrap;gap:.45rem;margin:1.3rem 0 .4rem;
  justify-content:flex-start}
.hex{
  width:108px;aspect-ratio:1.1547/1;flex:0 0 auto;
  clip-path:polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%);
  background:linear-gradient(165deg,#1B3A5C,#102338);
  border:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:.3rem .5rem;gap:.05rem;
}
.hex .r{font-family:var(--titre);font-weight:700;font-size:1.5rem;
  color:var(--or);line-height:1;font-variant-numeric:tabular-nums}
.hex .u{font-size:.72rem;font-weight:600;color:var(--texte);line-height:1.15;
  overflow-wrap:anywhere;hyphens:auto}
.hex .a{font-size:.63rem;color:var(--faible);font-variant-numeric:tabular-nums}
@media (max-width:420px){
  .hex{width:88px}
  .hex .r{font-size:1.15rem}
}
/* Le seul moment de mouvement de la page : la ruche se pose à l'arrivée. */
@media (prefers-reduced-motion:no-preference){
  .hex{animation:pose .5s cubic-bezier(.2,.7,.3,1) backwards}
  .hex:nth-child(1){animation-delay:.02s} .hex:nth-child(2){animation-delay:.07s}
  .hex:nth-child(3){animation-delay:.12s} .hex:nth-child(4){animation-delay:.17s}
  .hex:nth-child(5){animation-delay:.22s} .hex:nth-child(6){animation-delay:.27s}
  .hex:nth-child(7){animation-delay:.32s} .hex:nth-child(8){animation-delay:.37s}
}
@keyframes pose{from{opacity:0;transform:translateY(-9px) scale(.94)}
                to{opacity:1;transform:none}}

/* ---------------------------------------------- mouvements */
.mv{display:grid;grid-template-columns:1fr auto auto;gap:.3rem .9rem;
  align-items:baseline;padding:.55rem 0;border-bottom:1px solid rgba(31,71,102,.5)}
.mv:last-child{border-bottom:0}
.mv .nom{font-weight:600;min-width:0}
.mv .rg{font-size:.85rem;color:var(--faible);
  font-variant-numeric:tabular-nums;white-space:nowrap}
.mv .d{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;
  font-family:var(--titre);font-size:1.02rem}
.up .d{color:var(--or)} .dn .d{color:var(--sang)}
.mv .bar{grid-column:1/-1;height:2px;margin-top:.3rem;background:rgba(31,71,102,.6)}
.mv .bar i{display:block;height:100%}
.up .bar i{background:linear-gradient(90deg,var(--or),var(--or-vif))}
.dn .bar i{background:linear-gradient(90deg,var(--sang),#8E2B36)}

/* ---------------------------------------------- jetons d'unité */
/* Coins coupés : la forme des cartouches du client League. Les noms
   d'unités sont trop longs pour tenir dans un hexagone lisible. */
.puces{display:flex;flex-wrap:wrap;gap:.4rem;margin:.65rem 0 0;padding:0;list-style:none}
.ros{display:flex;flex-wrap:wrap;gap:.4rem;margin:.15rem 0}
.puces li,.puce{
  font-size:.84rem;font-weight:500;padding:.26rem .62rem;
  background:#122A44;color:var(--doux);
  border:1px solid var(--trait);
  clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px);
}
.puce.carry{background:rgba(200,170,110,.14);border-color:var(--or);
  color:var(--or-vif);font-weight:700}
.puce.miss{opacity:.4}

/* ---------------------------------------------- sélecteur de mode */
.seg{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1.2rem}
.seg button{
  font-family:var(--corps);font-size:.92rem;font-weight:600;
  background:var(--abysse);color:var(--doux);
  border:1px solid var(--trait);padding:.45rem 1rem;cursor:pointer;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%);
}
.seg button:hover{color:var(--texte);border-color:var(--or-vif)}
.seg button[aria-pressed="true"]{background:var(--or);color:var(--nuit);
  border-color:var(--or);font-weight:700}

/* ---------------------------------------------- compos */
.compo{
  background:linear-gradient(180deg,var(--pierre),var(--abysse));
  border:1px solid var(--trait);padding:1.05rem 1.15rem;margin-bottom:.9rem;
}
.compo.top{border-color:var(--trait-or);box-shadow:inset 0 2px 0 var(--or)}
.compo .ligne1{display:flex;align-items:baseline;gap:.75rem;flex-wrap:wrap;
  margin-bottom:.6rem}
.compo .n{font-size:1.16rem;font-weight:700;font-family:var(--titre);
  letter-spacing:.01em}
.compo .val{font-family:var(--titre);font-weight:700;color:var(--or);
  font-variant-numeric:tabular-nums;font-size:1.25rem}
.compo .lvl{font-size:.82rem;color:var(--faible)}
.compo .stats{font-size:.86rem;color:var(--doux);margin-top:.6rem;
  font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.compo .stats b{color:var(--texte)}
.compo .stats u{color:var(--or-vif);text-decoration-color:var(--or)}
.compo .txt{font-size:.93rem;color:var(--doux);margin-top:.55rem}

/* ---------------------------------------------- recherche */
.rech{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1.1rem}
.rech input{
  flex:1;min-width:210px;font-family:var(--corps);font-size:1rem;
  background:#0A1B2E;border:1px solid var(--trait);color:var(--texte);
  padding:.65rem .9rem;
}
.rech input::placeholder{color:var(--faible)}
.rech input:focus{outline:none;border-color:var(--hextech);
  box-shadow:0 0 0 1px var(--hextech)}

/* ---------------------------------------------- tableau */
.tbl{overflow-x:auto;border:1px solid var(--trait)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:.55rem .8rem;
  border-bottom:1px solid rgba(31,71,102,.45);white-space:nowrap}
th{font-size:.78rem;letter-spacing:.04em;color:var(--or);
  background:#0A1B2E;font-weight:700;border-bottom-color:var(--trait-or)}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(odd){background:rgba(17,38,63,.45)}
td.num{font-variant-numeric:tabular-nums;text-align:right}
.rang{color:var(--or);font-family:var(--titre);font-weight:700}

/* ---------------------------------------------- calendrier */
.cal{display:grid;gap:.45rem}
.evt{display:grid;grid-template-columns:auto 1fr auto;gap:.9rem;align-items:center;
  padding:.65rem .95rem;background:var(--abysse);border:1px solid var(--trait)}
.evt.passe{opacity:.45}
.evt.prochain{border-color:var(--trait-or);box-shadow:inset 2px 0 0 var(--or)}
.evt .dt{font-size:.86rem;color:var(--doux);white-space:nowrap;
  font-variant-numeric:tabular-nums;font-weight:600}
.evt .nm{font-weight:500;min-width:0}
.evt .tag{font-size:.74rem;padding:.18rem .55rem;border:1px solid var(--trait);
  color:var(--faible);white-space:nowrap;font-weight:600}
.evt .tag.ok{border-color:var(--or);color:var(--or)}

/* ---------------------------------------------- distribution */
.dist{display:grid;gap:.4rem}
.dl{display:grid;grid-template-columns:2.2rem 1fr 2.2rem 3.2rem;
  gap:.6rem;align-items:center}
.dl .p{font-family:var(--titre);font-weight:700;color:var(--or);font-size:.98rem}
.dl .b{position:relative;height:16px;background:rgba(31,71,102,.38)}
.dl .b i{display:block;height:100%}
.dl .b i.pl{background:linear-gradient(90deg,#0AC8B9,#14E0CF)}
.dl .b i.mo{background:linear-gradient(90deg,#5A3F46,#8E5560)}
/* le repère du hasard */
.dl .b u{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--or);
  opacity:.85;transform:translateX(-1px)}
.dl .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.dl .e{font-size:.82rem;font-variant-numeric:tabular-nums;text-align:right;
  font-weight:600}
.dl .e.pl{color:var(--hextech)} .dl .e.mo{color:var(--sang)}

.ecarts{list-style:none;padding:0;margin:1.2rem 0 0;display:grid;gap:.4rem;
  font-size:.9rem;color:var(--doux)}
.ecarts li{padding-left:1rem;position:relative}
.ecarts li::before{content:"";position:absolute;left:0;top:.52em;width:6px;height:6px;
  background:var(--or);transform:rotate(45deg)}
.ecarts b{color:var(--texte);font-weight:700}

details.pourquoi{border:1px solid var(--trait);background:var(--abysse);
  padding:.75rem 1.1rem;margin-bottom:1rem}
details.pourquoi summary{cursor:pointer;font-weight:700;color:var(--or);
  font-size:.93rem;list-style:none}
details.pourquoi summary::-webkit-details-marker{display:none}
details.pourquoi summary::before{content:"▸ ";color:var(--or)}
details.pourquoi[open] summary::before{content:"▾ "}
details.pourquoi p{margin:.8rem 0 0}

footer{border-top:1px solid var(--trait);margin-top:3.5rem;padding-top:1.3rem;
  font-size:.84rem;color:var(--faible)}
.vide{color:var(--faible);font-style:italic;padding:1.4rem 0}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header>
  <div class="hwrap">
    <div class="marque">
      <b>ORACLE<span class="pt">·</span>TFT</b>
      <span class="sub" id="hsub">chargement…</span>
    </div>
    <nav role="tablist" aria-label="Sections">
      <button role="tab" data-vue="recap"   aria-selected="true">Récap méta</button>
      <button role="tab" data-vue="preparer" aria-selected="false">Préparer ses games</button>
      <button role="tab" data-vue="oracle"  aria-selected="false">L'Oracle</button>
      <button role="tab" data-vue="profil"  aria-selected="false">Profil</button>
    </nav>
  </div>
</header>

<main>
  <section class="vue" id="v-recap"></section>
  <section class="vue" id="v-preparer" hidden></section>
  <section class="vue" id="v-oracle" hidden></section>
  <section class="vue" id="v-profil" hidden></section>
  <footer>
    <p class="faible" id="pied">Données : MetaTFT. Projet personnel, sans lien avec Riot Games.</p>
  </footer>
</main>

<script>
/* ===================================================================
   Le site ne contient AUCUNE donnée de jeu. Tout vient de data/.
   C'est le point de couture : en v2, ces trois URL deviendront des
   routes d'API et rien d'autre ne changera.
   =================================================================== */
const SOURCES = {
  meta:       "data/meta/courant.json",
  profil:     "data/profil.json",
  calendrier: "data/calendrier.json"
};
const D = {};              // données chargées
const $  = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const nb = n => (n ?? 0).toLocaleString("fr-FR").replace(/ | /g, " ");
const fdate = iso => { if(!iso) return "—";
  const [a,m,j] = iso.split("-"); return `${j}/${m}/${a}`; };

/* -------------------------------------------------- chargement */
async function charger(){
  const res = {};
  for(const [cle, url] of Object.entries(SOURCES)){
    try {
      const r = await fetch(url, {cache: "no-store"});
      if(!r.ok) throw new Error(`HTTP ${r.status}`);
      res[cle] = await r.json();
    } catch(e){
      res[cle] = null;
      console.warn(`${cle} illisible :`, e.message);
    }
  }
  Object.assign(D, res);
}

/* -------------------------------------------------- utilitaires */
function ligneMouvement(m, sens){
  const d = Math.abs(m.delta);
  const pct = Math.min(100, d / 40 * 100);
  return `<div class="mv ${sens}">
    <span class="nom">${esc(m.nom)}</span>
    <span class="rg">${m.rang_avant}<sup>e</sup> → ${m.rang_apres}<sup>e</sup>
      · ${m.avg_avant.toFixed(2)} → ${m.avg_apres.toFixed(2)}</span>
    <span class="d">${sens === "up" ? "−" : "+"}${d}</span>
    <span class="bar"><i style="width:${pct}%"></i></span></div>`;
}

function carteCompo(c, mode, premier){
  const M = D.meta.modes[mode];
  const val = c[M.cle];
  const ros = (c.roster || []).map(x =>
    x.endsWith("*") ? `<span class="puce carry">${esc(x.slice(0,-1))}</span>`
                    : `<span class="puce">${esc(x)}</span>`).join("");
  const conteste = c.pr >= 0.45
    ? ` <span style="color:var(--rouille)">— très contestée</span>`
    : (c.pr <= 0.12 ? ` <span style="color:var(--cyan)">— peu contestée</span>` : "");
  const sv = (k, t) => k === M.cle ? `<u>${t}</u>` : t;
  return `<article class="compo${premier ? " top" : ""}">
    <div class="ligne1">
      <span class="n">${esc(c.n)}</span>
      <span class="val">${val == null ? "—" : val.toFixed(val < 10 ? 2 : 1)}${M.unite}</span>
      <span class="lvl">${esc(c.lvl || "")}</span>
    </div>
    <div class="ros">${ros}</div>
    <div class="stats">
      ${sv("avg", `placement <b>${c.avg.toFixed(2)}</b>`)} ·
      ${c.t4 != null ? sv("t4", `top 4 <b>${c.t4.toFixed(1)} %</b>`) + " · " : ""}
      ${sv("wr", `victoires <b>${c.wr.toFixed(1)} %</b>`)} ·
      pick ${c.pr}${conteste}
    </div>
    ${c.note ? `<div class="txt">${esc(c.note)}</div>` : ""}
  </article>`;
}

/* -------------------------------------------------- vue : récap */
function vueRecap(){
  const m = D.meta;
  if(!m) return `<div class="note warn"><b>Données indisponibles.</b>
    Le fichier <code>${SOURCES.meta}</code> n'a pas pu être lu.
    Relance <code>python3 tools/build/build_site.py</code>.</div>`;
  const d = m.diff, t = m.tete_stable;

  const bloc = d ? `
    <div class="grille">
      <div class="carte">
        <div class="chiffre">${d.spearman}</div>
        <div class="unite">corrélation de rang</div>
        <p class="faible" style="margin:.8rem 0 0">Entre le relevé ${fdate(d.de.date)}
          (${esc(d.de.patch)}) et celui du ${fdate(d.a.date)} (${esc(d.a.patch)}).</p>
      </div>
      <div class="carte">
        <div class="chiffre sm">${d.deplacement_median} rangs</div>
        <div class="unite">déplacement médian par unité</div>
        <p class="faible" style="margin:.8rem 0 0">Maximum observé :
          ${d.deplacement_max} rangs, sur ${d.n_comparables} unités comparables.</p>
      </div>
      <div class="carte">
        <div class="chiffre sm">${d.part_reelle_pct} %</div>
        <div class="unite">du mouvement est réel</div>
        <p class="faible" style="margin:.8rem 0 0">Si rien n'avait changé, le seul hasard
          d'échantillonnage donnerait ${d.plancher_bruit}. Le reste est du vrai mouvement.</p>
      </div>
    </div>

    ${!d.meme_elo ? `<div class="note warn"><b>Tranches d'elo différentes</b>
      (${esc(d.de.rang)} puis ${esc(d.a.rang)}) : une part du mouvement vient du
      changement de population, pas des patchs.</div>` : ""}

    <h2>Ce qui monte</h2>
    <div class="carte">${d.montees.map(x => ligneMouvement(x, "up")).join("")}</div>
    <h2>Ce qui tombe</h2>
    <div class="carte">${d.chutes.map(x => ligneMouvement(x, "dn")).join("")}</div>` : "";

  // Chaque unité de la tête est rejointe à son rang courant : l'hexagone
  // porte une mesure, pas un médaillon décoratif.
  const parNom = Object.fromEntries((m.unites || []).map(u => [u.nom, u]));

  const tete = t && t.unites.length ? `
    <h2>Ce qui ne bouge jamais</h2>
    <div class="carte">
      <p>Les <b>mêmes ${t.unites.length} unités</b> occupent la tête du classement
      dans les ${t.n_releves} relevés depuis le ${fdate(t.depuis)}, malgré les patchs
      et un changement de tranche d'elo. Seul leur ordre interne change.
      ${t.premiere_chaque_fois ? `<b>${esc(t.premiere_chaque_fois)} est première à chaque fois.</b>` : ""}</p>
      <div class="ruche">${[...t.unites]
        .sort((a,b) => (parNom[a]?.rang ?? 99) - (parNom[b]?.rang ?? 99))
        .map(nom => {
        const u = parNom[nom];
        return `<div class="hex">
          <span class="r">${u ? u.rang : "—"}</span>
          <span class="u">${esc(nom)}</span>
          <span class="a">${u ? u.avg.toFixed(2) : ""}</span>
        </div>`;
      }).join("")}</div>
      <p class="faible" style="margin:1.5rem 0 .9rem">Chaque hexagone porte le rang de
      l'unité dans le relevé courant, et son placement moyen.</p>
      <p class="faible" style="margin-top:.9rem">La tête du classement est structurelle —
      elle suit le coût des unités, pas l'équilibrage. Le ventre, lui, bouge à chaque patch :
      c'est là que se trouve l'avantage.</p>
    </div>` : "";

  return `<h1>Ce qui a vraiment bougé</h1>
    <p class="doux">${nb(m.releve.n_parties)} parties en ${esc(m.releve.rang)},
      comparées au relevé précédent. Pas une tier list : une mesure de l'écart entre deux patchs.</p>
    ${bloc}${tete}
    <h2>Le classement complet</h2>
    <div class="tbl"><table>
      <thead><tr><th>#</th><th>Unité</th><th class="num">Placement</th>
        <th class="num">Victoires</th><th class="num">Parties</th></tr></thead>
      <tbody>${m.unites.map(u => `<tr>
        <td class="rang">${u.rang}</td><td>${esc(u.nom)}</td>
        <td class="num">${u.avg.toFixed(2)}</td>
        <td class="num">${u.wr.toFixed(1)} %</td>
        <td class="num">${nb(u.n)}</td></tr>`).join("")}</tbody>
    </table></div>`;
}

/* -------------------------------------------------- vue : préparer */
let MODE = "ladder";
function vuePreparer(){
  const m = D.meta;
  if(!m) return `<div class="note warn">Données indisponibles.</div>`;
  const M = m.modes[MODE];
  const libelle = {ladder:"Ladder", cumule:"Points cumulés", checkmate:"Checkmate"};
  return `<h1>Préparer ses games</h1>
    <p class="doux">La même question a trois réponses. Ce que tu dois jouer dépend de
      l'enjeu, pas seulement du patch.</p>

    <div class="seg" role="group" aria-label="Mode de jeu">
      ${Object.keys(m.modes).map(k => `<button data-mode="${k}"
        aria-pressed="${k === MODE}">${libelle[k]}</button>`).join("")}
    </div>
    <div class="note"><b>${libelle[MODE]}</b> — classé par ${esc(M.critere)}. ${esc(M.pourquoi)}</div>
    ${M.classement.length
      ? M.classement.map((c,i) => carteCompo(c, MODE, i === 0)).join("")
      : `<div class="vide">Aucune compo ne porte cette mesure dans le relevé courant.</div>`}

    <h2>Où je peux aller ?</h2>
    <p class="doux">Tape les unités que tu as en main. Le classement se fait par proximité,
      et le carry compte double — tenir trois pièces de façade ne vaut pas tenir le carry.</p>
    <div class="rech">
      <input id="pivot" type="text" autocomplete="off" spellcheck="false"
        placeholder="ex : krug brambleback pebbles">
    </div>
    <div id="pivot-res"></div>`;
}

function norm(s){
  return String(s).toLowerCase().normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"").replace(/['’.\-\s]/g,"");
}
function pivot(saisie){
  const m = D.meta;
  const mots = saisie.split(/[\s,;]+/).filter(Boolean).map(norm);
  if(!mots.length) return "";
  const noms = new Set();
  m.compos.forEach(c => (c.roster||[]).forEach(r => noms.add(r.replace(/\*$/,""))));
  const connus = [...noms].filter(n => mots.includes(norm(n)));
  if(!connus.length) return `<div class="vide">Aucune de ces unités n'apparaît dans
    les compos du relevé. Toutes ne définissent pas une ligne : certaines sont des
    pièces d'appoint, d'autres des unités flexibles.</div>`;

  const res = m.compos.map(c => {
    const ros = (c.roster||[]).map(r => r.replace(/\*$/,""));
    const ont = ros.filter(r => connus.some(k => norm(k) === norm(r)));
    const manq = ros.filter(r => !ont.includes(r));
    const aCarry = ont.some(r => norm(r) === norm(c.carry));
    return {c, ont, manq, aCarry, score: ont.length/ros.length + (aCarry ? .35 : 0)};
  }).filter(p => p.ont.length).sort((a,b) => b.score - a.score);

  return `<p class="faible">Avec <b>${connus.map(esc).join(" · ")}</b> —
    ${res.length} ligne(s) accessible(s).</p>` + res.map(p => `
    <article class="compo${p.aCarry ? " top" : ""}">
      <div class="ligne1"><span class="n">${esc(p.c.n)}</span>
        <span class="val">${p.ont.length}/${p.ont.length + p.manq.length}</span>
        <span class="lvl">${esc(p.c.lvl || "")}</span></div>
      <div class="ros">${p.ont.map(x => `<span class="puce${norm(x) === norm(p.c.carry) ? " carry" : ""}">${esc(x)}</span>`).join("")}${p.manq.map(x => `<span class="puce miss">${esc(x)}</span>`).join("")}</div>
      <div class="txt">${p.aCarry
        ? "<b>Tu tiens le carry.</b> C'est le pivot le moins cher."
        : (p.ont.length/(p.ont.length+p.manq.length) >= .5
            ? "Moitié du board en place, mais <b>pas le carry</b> — c'est lui qui décide."
            : "Pivot lointain : il manque l'essentiel.")}</div>
      <div class="stats">placement <b>${p.c.avg.toFixed(2)}</b> ·
        victoires <b>${p.c.wr.toFixed(1)} %</b> · pick ${p.c.pr}</div>
    </article>`).join("");
}

/* -------------------------------------------------- vue : profil */
/* La distribution tranche ce qu'une moyenne ne peut pas : huit 4es et
   quatre 1res suivies de quatre 8es donnent le même 4.50. Le trait vertical
   marque la référence du hasard, sans laquelle un écart ne veut rien dire. */
function blocDistribution(me){
  const di = me.distribution;
  if(!di) return "";
  const vals = Object.values(di);
  const tot = vals.reduce((a,b) => a + b, 0);
  if(!tot) return "";
  const att = tot / 8, max = Math.max(...vals, 1);

  const barres = [1,2,3,4,5,6,7,8].map(k => {
    const v = di[k] ?? di[String(k)] ?? 0;
    const ec = v - att;
    const sens = ec >= 0 ? "pl" : "mo";
    return `<div class="dl">
      <span class="p">${k}<sup>e</sup></span>
      <span class="b"><i class="${sens}" style="width:${v / max * 100}%"></i>
        <u style="left:${att / max * 100}%"></u></span>
      <span class="v">${v}</span>
      <span class="e ${sens}">${ec >= 0 ? "+" : "−"}${Math.abs(ec).toFixed(1)}</span>
    </div>`;
  }).join("");

  const lib = {top2:"Top 2", bas2:"7<sup>e</sup> et 8<sup>e</sup>",
               top4:"Top 4", "8e":"8<sup>e</sup> place"};
  const es = me.ecarts_solides || {};
  const lignes = Object.entries(es).filter(([k]) => k !== "note")
    .map(([k,v]) => `<li><b>${lib[k] || esc(k)}</b> ${esc(v)}</li>`).join("");

  return `<div class="carte">
    <h3>Distribution des placements</h3>
    <p class="faible" style="margin-bottom:1rem">Le trait vertical marque ce que
      donnerait le hasard : ${att.toFixed(1)} parties par place.</p>
    <div class="dist">${barres}</div>
    ${lignes ? `<ul class="ecarts">${lignes}</ul>` : ""}
    ${es.note ? `<p class="faible" style="margin:.9rem 0 0">${esc(es.note)}</p>` : ""}
  </div>`;
}

function vueProfil(){
  const p = D.profil?.joueurs?.[0];
  const c = D.calendrier;
  if(!p) return `<div class="note warn">Profil indisponible.</div>`;
  const me = p.mesure;
  const auj = new Date().toISOString().slice(0,10);

  const evts = [];
  (c?.patchs || []).forEach(x => evts.push({...x, type:"patch"}));
  (c?.jalons || []).forEach(x => evts.push({...x, type:"jalon"}));
  evts.sort((a,b) => a.date.localeCompare(b.date));
  const prochain = evts.find(e => e.date > auj);

  return `<h1>${esc(p.rang.tier)}, ${p.rang.lp} LP</h1>
    <p class="doux">${esc(p.riot_id)}, ${esc(p.region.toUpperCase())}.
      Rang atteint le ${fdate(p.rang.date)}. Objectif : <b>${esc(p.objectif)}</b>.</p>

    <h2>Profil mesuré</h2>
    <p class="doux">${me.parties} parties retenues${me.parties_lachees_retirees
      ? `, ${me.parties_lachees_retirees} parties lâchées écartées` : ""}. Mesuré à
      ${esc(me.rang_alors)}.</p>
    <div class="grille">
      <div class="carte"><div class="chiffre sm">${me.placement_moyen}</div>
        <div class="unite">placement moyen — le hasard donne 4,50</div></div>
      <div class="carte"><div class="chiffre sm">${me.top4_pct} %</div>
        <div class="unite">top 4 — le hasard donne 50 %</div></div>
      <div class="carte"><div class="chiffre sm">${me.victoires_pct} %</div>
        <div class="unite">1<sup>res</sup> places — le hasard donne 12,5 %</div></div>
    </div>
    ${blocDistribution(me)}
    ${me.note ? `<details class="pourquoi"><summary>Pourquoi ces chiffres</summary>
      <p class="faible">${esc(me.note)}</p>
      ${me.retracte ? `<p class="faible"><b>Rétracté :</b> ${esc(me.retracte)}</p>` : ""}
      ${me.a_refaire ? `<p class="faible"><b>À refaire :</b> ${esc(me.a_refaire)}</p>` : ""}
    </details>` : ""}

    <h2>Calendrier</h2>
    <div class="cal">${evts.map(e => {
      const passe = e.date <= auj;
      const est = e === prochain;
      return `<div class="evt${passe ? " passe" : ""}${est ? " prochain" : ""}">
        <span class="dt">${fdate(e.date)}</span>
        <span class="nm">${esc(e.nom)}${e.note ? ` <span class="faible">— ${esc(e.note)}</span>` : ""}</span>
        <span class="tag${e.releve ? " ok" : ""}">${
          e.type === "jalon" ? (e.certain === false ? "estimé" : "jalon")
          : (e.releve ? "relevé" : (passe ? "non relevé" : "à venir"))}</span></div>`;
    }).join("")}</div>
    ${prochain ? `<p class="faible" style="margin-top:1rem">Prochaine échéance :
      <b>${esc(prochain.nom)}</b>, dans
      ${Math.round((Date.parse(prochain.date) - Date.parse(auj)) / 864e5)} jours.</p>` : ""}

    <h2>Décroissance</h2>
    <div class="note warn">À partir de Master : 14 parties en banque, une retirée par jour,
      puis <b>−50 LP par jour</b> d'inactivité. À ${p.rang.lp} LP, une semaine d'absence
      coûte le rang.</div>`;
}

/* -------------------------------------------------- rendu */
const VUES = {recap: vueRecap, preparer: vuePreparer, oracle: vueOracle, profil: vueProfil};
let vueActive = "recap";

function rendre(){
  $("#v-" + vueActive).innerHTML = VUES[vueActive]();
  if(vueActive === "preparer") brancherPreparer();
}
function brancherPreparer(){
  document.querySelectorAll("[data-mode]").forEach(b =>
    b.addEventListener("click", () => { MODE = b.dataset.mode; rendre(); }));
  const inp = $("#pivot");
  if(inp) inp.addEventListener("input", () => {
    $("#pivot-res").innerHTML = inp.value.trim() ? pivot(inp.value) : "";
  });
}
function aller(v){
  vueActive = v;
  document.querySelectorAll("nav button").forEach(b =>
    b.setAttribute("aria-selected", String(b.dataset.vue === v)));
  document.querySelectorAll(".vue").forEach(s => s.hidden = (s.id !== "v-" + v));
  rendre();
  try { history.replaceState(null, "", "#" + v); } catch(e){}
}
document.querySelectorAll("nav button").forEach(b =>
  b.addEventListener("click", () => aller(b.dataset.vue)));

charger().then(() => {
  const m = D.meta;
  $("#hsub").textContent = m
    ? `patch ${m.releve.patch} · ${m.releve.rang} · ${fdate(m.releve.date)}`
    : "données indisponibles";
  if(m) $("#pied").innerHTML =
    `Données : ${esc(m.releve.source || "MetaTFT")} — ${nb(m.releve.n_parties)} parties,
     ${esc(m.releve.fenetre || "")}. Généré le ${fdate(m.genere_le)}.
     Projet personnel, sans lien avec Riot Games.`;
  const h = (location.hash || "").replace("#", "");
  aller(VUES[h] ? h : "recap");
});
